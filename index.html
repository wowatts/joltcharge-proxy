<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ampeco Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e2e8f0;font-family:system-ui,sans-serif;padding:20px;min-height:100vh}
.header{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.logo{background:#00c2a8;border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:#00c2a8;color:#0d1117;border:none;border-radius:9px;padding:8px 18px;font-weight:700;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gbtn{background:#1a1f2e;color:#8892a4;border:1px solid #2d3748;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
.sel{background:#1a1f2e;color:#e2e8f0;border:1px solid #2d3748;border-radius:9px;padding:8px 14px;font-size:13px}
.bdg{background:#00c2a818;color:#00c2a8;border:1px solid #00c2a840;border-radius:8px;padding:4px 12px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{background:transparent;color:#8892a4;border:none;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.tab.active{background:#00c2a8;color:#0d1117}
.tc{background:#ffffff18;border-radius:99px;padding:1px 6px;font-size:10px}
.tab.active .tc{background:#0d111766}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card{background:#1a1f2e;border-radius:12px;padding:18px 22px;flex:1;min-width:140px}
.ci{font-size:24px;margin-bottom:4px}
.cl{color:#8892a4;font-size:12px;margin-bottom:4px}
.cv{font-size:28px;font-weight:700}
.cs{color:#8892a4;font-size:11px;margin-top:4px}
.search{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:8px 14px;color:#e2e8f0;font-size:13px;width:100%;margin-bottom:14px}
.tw{background:#1a1f2e;border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 13px;text-align:left;font-weight:600;background:#0d1117;color:#8892a4;font-size:12px;white-space:nowrap}
tr:nth-child(even) td{background:#1e2535}
tr:nth-child(odd) td{background:#1a1f2e}
td{padding:8px 13px;border-top:1px solid #2d3748}
.mono{font-family:monospace;font-size:11px;color:#8892a4}
.muted{color:#8892a4}
.green{color:#10b981;font-weight:600}
.bs{border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lcard{background:#1a1f2e;border-radius:12px;padding:16px}
.sec{background:#1a1f2e;border-radius:12px;padding:18px;margin-bottom:16px}
.stitle{font-weight:600;margin-bottom:14px}
.sgrid{display:flex;gap:10px;flex-wrap:wrap}
.sbox{background:#0d1117;border-radius:8px;padding:10px 16px;text-align:center}
.snum{font-weight:700;font-size:22px;margin-top:6px}
.pw{background:#1a1f2e;border-radius:12px;padding:24px;margin-bottom:16px}
.pi{margin-bottom:14px}
.pr{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.pt{background:#0d1117;border-radius:99px;height:6px;overflow:hidden}
.pf{height:6px;border-radius:99px;background:#00c2a8}
.spin-wrap{text-align:center;padding:40px;color:#8892a4}
.spin{font-size:36px;display:inline-block;animation:sp 1.2s linear infinite}
.plog{margin-top:12px;background:#0d1117;border-radius:8px;padding:10px 12px;max-height:160px;overflow-y:auto;text-align:left}
.ll{font-family:monospace;font-size:11px;color:#8892a4;margin-bottom:2px}
.lok{color:#00c2a8}.lerr{color:#ef4444}
.err{background:#ef444418;border:1px solid #ef444440;border-radius:10px;padding:14px;color:#ef4444;margin-bottom:16px;font-size:13px;white-space:pre-wrap}
.welcome{background:#1a1f2e;border-radius:12px;padding:50px;text-align:center}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡</div>
  <div>
    <div style="font-weight:700;font-size:20px">Ampeco Dashboard</div>
    <div style="color:#4b5563;font-size:12px">joltcharge-us.us.charge.ampeco.tech</div>
  </div>
  <div class="hr">
    <select class="sel" id="monthSel" onchange="onMonthChange()"></select>
    <button class="gbtn" id="clearBtn" onclick="clearCurrentCache()" style="display:none;font-size:12px">🗑️ Clear Cache</button>
    <button class="btn" id="loadBtn" onclick="loadAll()">🔌 Load Data</button>
    <span class="bdg" id="badge" style="display:none">🟢 <span id="badgeTxt"></span></span>
    <span style="color:#4b5563;font-size:11px" id="cacheTxt"></span>
  </div>
</div>

<div class="err" id="errEl" style="display:none"></div>

<div class="spin-wrap" id="loadEl" style="display:none">
  <div class="spin">⚡</div>
  <div style="font-size:14px;margin-top:10px" id="loadMsg">Loading...</div>
  <div style="font-size:12px;color:#4b5563;margin-top:4px" id="loadSub"></div>
  <div class="plog" id="plog"></div>
</div>

<div class="welcome" id="welcomeEl">
  <div style="font-size:48px;margin-bottom:14px">⚡</div>
  <div style="font-weight:700;font-size:18px;margin-bottom:8px">Ampeco Dashboard</div>
  <div style="color:#8892a4;font-size:14px;margin-bottom:22px">Select a month and click Load Data.</div>
  <button class="btn" onclick="loadAll()">🔌 Load Data</button>
</div>

<div id="main" style="display:none">
  <div class="tabs" id="tabsEl"></div>
  <input type="text" class="search" id="searchBox" oninput="renderTab()" style="display:none" placeholder="Search..."/>
  <div id="tabContent"></div>
</div>

<script>
var PROXY = '/api/ampeco';
var SC = {available:'#00c2a8',charging:'#3b82f6',faulted:'#ef4444',unavailable:'#f59e0b',preparing:'#a78bfa',finishing:'#06b6d4',reserved:'#f97316',online:'#00c2a8',offline:'#8892a4',active:'#3b82f6',pending:'#f59e0b',finished:'#10b981',completed:'#10b981',unknown:'#8892a4'};
var TABS = [
  {key:'overview',label:'Overview'},
  {key:'chargepoints',label:'Charge Points',dk:'chargePoints'},
  {key:'evses',label:'EVSEs',dk:'evses'},
  {key:'sessions',label:'Sessions',dk:'sessions'},
  {key:'locations',label:'Locations',dk:'locations'},
  {key:'users',label:'Users',dk:'users'},
  {key:'transactions',label:'Transactions',dk:'transactions'}
];
var allData = null;
var currentTab = 'overview';

function $(id) { return document.getElementById(id); }
function n(v) { if (!v) return '–'; if (typeof v === 'string') return v; return v.en || v[Object.keys(v)[0]] || '–'; }
function fmt(d) { return d ? new Date(d).toLocaleString() : '–'; }
function fmtD(d) { return d ? new Date(d).toLocaleDateString() : '–'; }
function money(v) { return (v != null && v !== '') ? '$' + parseFloat(v).toFixed(2) : '–'; }

function mkBadge(s) {
  var k = (s||'unknown').toLowerCase(), c = SC[k]||'#8892a4';
  var el = document.createElement('span');
  el.className = 'bs';
  el.style.cssText = 'background:'+c+'22;color:'+c+';border:1px solid '+c+'44';
  el.textContent = s||'unknown';
  return el;
}

function addLog(msg, cls) {
  var el = $('plog'), d = document.createElement('div');
  d.className = 'll'+(cls?' '+cls:'');
  d.textContent = '['+new Date().toLocaleTimeString()+'] '+msg;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

// ── Cache ─────────────────────────────────────────────────────────
function cKey(ym) { return 'ampeco_v2_'+ym; }

function saveCache(ym, data, lastFetch) {
  try {
    var payload = {
      v:2, savedAt:new Date().toISOString(), lastFetch:lastFetch,
      locations:    data.locations    || [],
      chargePoints: data.chargePoints || [],
      evses:        data.evses        || [],
      users:        data.users        || [],
      sessCount:    (data.sessions||[]).length,
      txnCount:     (data.transactions||[]).length,
      totalEnergy:  (data.sessions||[]).reduce(function(a,s){return a+parseFloat(s.energy||0);},0),
      totalRevenue: (data.transactions||[]).reduce(function(a,t){return a+parseFloat(t.totalAmount||t.amount||0);},0),
      sessSample:   (data.sessions||[]).slice(0,200),
      txnSample:    (data.transactions||[]).slice(0,200)
    };
    var str = JSON.stringify(payload);
    localStorage.setItem(cKey(ym), str);
    var verify = localStorage.getItem(cKey(ym));
    var kb = Math.round(str.length/1024);
    if (verify) {
      alert('✅ Cache saved! Key: '+cKey(ym)+' Size: '+kb+'KB\nSwitch months now to test.');
      addLog('💾 Saved '+ym+' ('+kb+'KB)', 'lok');
      $('cacheTxt').textContent = '💾 '+kb+'KB cached';
    } else {
      alert('❌ localStorage.setItem ran but getItem returned null');
      addLog('❌ Cache write failed', 'lerr');
    }
    updateMonthLabels();
  } catch(e) {
    addLog('❌ Cache error: '+e.name+' '+e.message, 'lerr');
    $('cacheTxt').textContent = '❌ '+e.name;
  }
}

function loadCache(ym) {
  try {
    var raw = localStorage.getItem(cKey(ym));
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function clearCache(ym) {
  localStorage.removeItem(cKey(ym));
  updateMonthLabels();
}

function cacheToData(c, ym) {
  return {
    _month:ym,
    // Static data not cached — will be fetched fresh
    locations:    [],
    chargePoints: [],
    evses:        [],
    users:        [],
    // Sessions/transactions restored from tiny sample
    sessions:     c.sessSample   || [],
    transactions: c.txnSample    || [],
    activeSessions: [],
    // Pre-computed totals for overview cards
    _sessCount:   c.sessCount    || 0,
    _txnCount:    c.txnCount     || 0,
    _totalEnergy: c.totalEnergy  || 0,
    _totalRevenue:c.totalRevenue || 0
  };
}

function mergeById(a, b) {
  var map = {};
  (a||[]).forEach(function(r){map[String(r.id)]=r;});
  (b||[]).forEach(function(r){map[String(r.id)]=r;});
  return Object.values(map);
}

// ── Month helpers ─────────────────────────────────────────────────
function curYM() {
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function getYM() { return $('monthSel').value; }
function isPast(ym) { return ym < curYM(); }
function monthRange(ym) {
  var parts = ym.split('-'), y=parseInt(parts[0]), m=parseInt(parts[1]);
  return {from:ym+'-01', to:ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')};
}

function buildMonthOptions() {
  var sel = $('monthSel');
  sel.innerHTML = '';
  var now = new Date();
  for (var i=0; i<12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var opt = document.createElement('option');
    opt.value = ym;
    opt.textContent = d.toLocaleString('default',{month:'long',year:'numeric'});
    if (i===0) opt.selected = true;
    sel.appendChild(opt);
  }
  try {
    localStorage.setItem('ampeco_test','1');
    localStorage.removeItem('ampeco_test');
    var keys=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('ampeco_v2_'))keys.push(k.replace('ampeco_v2_',''));}
    $('cacheTxt').textContent = keys.length ? '💾 Cached: '+keys.join(', ') : '💾 Cache empty';
  } catch(e) { $('cacheTxt').textContent = '⚠️ No localStorage'; }
  updateMonthLabels();
}

function updateMonthLabels() {
  var sel = $('monthSel');
  for (var i=0;i<sel.options.length;i++) {
    var opt=sel.options[i], ym=opt.value;
    opt.textContent = opt.textContent.replace(/ [✓○]$/,'');
    if (isPast(ym)) opt.textContent += loadCache(ym) ? ' ✓' : ' ○';
  }
  var cb = $('clearBtn');
  if (cb) cb.style.display = (isPast(getYM()) && loadCache(getYM())) ? '' : 'none';
}

function clearCurrentCache() { clearCache(getYM()); loadAll(); }

function onMonthChange() {
  updateMonthLabels();
  var ym = getYM();
  var c = loadCache(ym);
  if (c) {
    addLog('📦 Cache hit for '+ym, 'lok');
    allData = cacheToData(c, ym);
    showDashboard();
    doBackgroundRefresh(ym, c);
  } else {
    loadAll();
  }
}

// ── Fetch ─────────────────────────────────────────────────────────
async function getPages(path, max) {
  max = max || 50;
  var all = [], page = 1, last = 1;
  do {
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    var url = PROXY+'?path='+encodeURIComponent(path+sep+'per_page=100&page='+page);
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP '+res.status);
    var j = await res.json();
    var items = j.data || j.items || (Array.isArray(j)?j:[]);
    all = all.concat(items);
    last = (j.meta&&j.meta.last_page) ? j.meta.last_page : 1;
    $('loadSub').textContent = 'Page '+page+' of '+Math.min(last,max);
    page++;
  } while (page<=last && page<=max);
  return all;
}

// ── Load all ──────────────────────────────────────────────────────
async function loadAll() {
  var ym = getYM();
  var now = new Date().toISOString();
  var range = monthRange(ym);
  var cached = loadCache(ym);
  var isInc = !!cached;
  var cacheAge = cached ? (Date.now()-new Date(cached.savedAt))/3600000 : 9999;
  var fromDt = range.from;
  if (cached && cached.lastFetch) {
    var d = new Date(cached.lastFetch);
    d.setTime(d.getTime()-2*3600000);
    fromDt = d.toISOString().slice(0,10);
  }

  $('welcomeEl').style.display = 'none';
  $('main').style.display = 'none';
  $('errEl').style.display = 'none';
  $('loadEl').style.display = 'block';
  $('plog').innerHTML = '';
  $('loadBtn').disabled = true;
  $('badge').style.display = 'none';

  addLog(isInc ? '📦 Incremental from '+fromDt : '🆕 Full fetch '+ym, 'lok');

  var data = {
    locations:    isInc ? (cached.locations    || []) : [],
    chargePoints: isInc ? (cached.chargePoints || []) : [],
    evses:        isInc ? (cached.evses        || []) : [],
    users:        isInc ? (cached.users        || []) : [],
    sessions:     isInc ? (cached.sessSample   || []) : [],
    transactions: isInc ? (cached.txnSample    || []) : [],
    activeSessions: []
  };

  var jobs = [
    {key:'chargePoints',label:'Charge Points',path:'/resources/charge-points/v1.0',max:100},
    {key:'sessions',    label:'Sessions',     path:'/resources/sessions/v1.0?filter[startedAt][from]='+fromDt+'&filter[startedAt][to]='+range.to, max:100, merge:isInc},
    {key:'transactions',label:'Transactions', path:'/resources/transactions/v1.0?filter[date][from]='+fromDt+'&filter[date][to]='+range.to, max:100, merge:isInc}
  ];
  if (!isInc || cacheAge>24) {
    jobs.push({key:'locations',label:'Locations',path:'/resources/locations/v1.0',max:100});
    jobs.push({key:'evses',label:'EVSEs',path:'/resources/evses/v1.0',max:100});
    jobs.push({key:'users',label:'Users',path:'/resources/users/v1.0',max:100});
  } else {
    addLog('⏭️ Locations/EVSEs/Users unchanged (<24h)', 'lok');
  }

  for (var i=0; i<jobs.length; i++) {
    var job = jobs[i];
    try {
      $('loadMsg').textContent = 'Fetching '+job.label+'...';
      var fresh = await getPages(job.path, job.max);
      if (job.merge) {
        var before = data[job.key].length;
        data[job.key] = mergeById(data[job.key], fresh);
        addLog('✅ '+job.label+': +'+(data[job.key].length-before)+' ('+data[job.key].length+' total)', 'lok');
      } else {
        data[job.key] = fresh;
        addLog('✅ '+job.label+': '+fresh.length, 'lok');
      }
    } catch(e) {
      addLog('❌ '+job.label+': '+e.message, 'lerr');
    }
  }

  try {
    $('loadMsg').textContent = 'Fetching active sessions...';
    var last24 = new Date(Date.now()-24*3600000).toISOString().slice(0,10);
    var recent = await getPages('/resources/sessions/v1.0?filter[startedAt][from]='+last24+'&sort=-startedAt', 5);
    data.activeSessions = recent.filter(function(s){return s.status==='active'||s.status==='pending';});
    addLog('✅ Active: '+data.activeSessions.length, 'lok');
  } catch(e) {
    addLog('❌ Active sessions: '+e.message, 'lerr');
    data.activeSessions = [];
  }

  saveCache(ym, data, now);
  allData = data;
  allData._month = ym;
  showDashboard();
}

async function doBackgroundRefresh(ym, cached) {
  var now = new Date().toISOString();
  var range = monthRange(ym);
  var fromDt = range.from;
  if (cached && cached.lastFetch) {
    var d = new Date(cached.lastFetch);
    d.setTime(d.getTime()-2*3600000);
    fromDt = d.toISOString().slice(0,10);
  }
  var cacheAge = cached ? (Date.now()-new Date(cached.savedAt))/3600000 : 9999;
  try {
    var freshCP   = await getPages('/resources/charge-points/v1.0', 100);
    var freshSess = await getPages('/resources/sessions/v1.0?filter[startedAt][from]='+fromDt+'&filter[startedAt][to]='+range.to, 100);
    var freshTxns = await getPages('/resources/transactions/v1.0?filter[date][from]='+fromDt+'&filter[date][to]='+range.to, 100);
    allData.chargePoints  = freshCP;
    allData.sessions      = mergeById(allData.sessions, freshSess);
    allData.transactions  = mergeById(allData.transactions, freshTxns);
    if (cacheAge>24) {
      allData.locations = await getPages('/resources/locations/v1.0', 100);
      allData.evses     = await getPages('/resources/evses/v1.0', 100);
      allData.users     = await getPages('/resources/users/v1.0', 100);
    }
    var last24 = new Date(Date.now()-24*3600000).toISOString().slice(0,10);
    var recent = await getPages('/resources/sessions/v1.0?filter[startedAt][from]='+last24+'&sort=-startedAt', 5);
    allData.activeSessions = recent.filter(function(s){return s.status==='active'||s.status==='pending';});
    delete allData._sessCount; delete allData._txnCount;
    delete allData._totalEnergy; delete allData._totalRevenue;
    saveCache(ym, allData, now);
    showDashboard();
  } catch(e) { console.error('Background refresh:', e); }
}

// ── Show dashboard ────────────────────────────────────────────────
function showDashboard() {
  try {
    var total = 0;
    var keys = Object.keys(allData);
    for (var i=0;i<keys.length;i++){if(Array.isArray(allData[keys[i]]))total+=allData[keys[i]].length;}
    var c = loadCache(allData._month);
    var ageMin = c ? Math.round((Date.now()-new Date(c.savedAt))/60000) : 0;
    var ageStr = ageMin<60 ? ageMin+'m ago' : Math.round(ageMin/60)+'h ago';
    $('badgeTxt').textContent = total.toLocaleString()+' · synced '+ageStr;
    $('badge').style.display = '';
    $('loadEl').style.display = 'none';
    $('welcomeEl').style.display = 'none';
    $('main').style.display = 'block';
    $('loadBtn').textContent = '🔄 Refresh';
    $('loadBtn').disabled = false;
    updateMonthLabels();
    buildTabs();
    switchTab(currentTab);
  } catch(e) {
    $('loadEl').style.display = 'none';
    $('loadBtn').disabled = false;
    $('loadBtn').textContent = '🔄 Refresh';
    $('errEl').textContent = '⚠️ '+e.message+'\n'+e.stack;
    $('errEl').style.display = 'block';
  }
}

// ── Tabs ──────────────────────────────────────────────────────────
function buildTabs() {
  var el = $('tabsEl'); el.innerHTML = '';
  TABS.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'tab'+(t.key===currentTab?' active':'');
    btn.onclick = function(){ switchTab(t.key); };
    btn.textContent = t.label;
    if (t.dk) {
      var cnt = (allData[t.dk]||[]).length;
      if (cnt) { var sp=document.createElement('span'); sp.className='tc'; sp.textContent=cnt.toLocaleString(); btn.appendChild(sp); }
    }
    el.appendChild(btn);
  });
}

function switchTab(key) {
  currentTab = key;
  $('searchBox').style.display = key==='overview'?'none':'block';
  $('searchBox').placeholder = 'Search '+key+'...';
  $('searchBox').value = '';
  buildTabs(); renderTab();
}

function filterArr(arr, fields) {
  var q = $('searchBox').value.toLowerCase();
  if (!q) return arr;
  return arr.filter(function(item){return fields.some(function(f){return String(item[f]||'').toLowerCase().indexOf(q)>=0;});});
}

// ── DOM helpers ───────────────────────────────────────────────────
function mkCard(icon,label,value,color,sub) {
  var d=document.createElement('div'); d.className='card';
  var i=document.createElement('div'); i.className='ci'; i.textContent=icon; d.appendChild(i);
  var l=document.createElement('div'); l.className='cl'; l.textContent=label; d.appendChild(l);
  var v=document.createElement('div'); v.className='cv'; v.style.color=color; v.textContent=value; d.appendChild(v);
  if (sub){var s=document.createElement('div'); s.className='cs'; s.textContent=sub; d.appendChild(s);}
  return d;
}

function mkTable(headers, rows) {
  var wrap=document.createElement('div'); wrap.className='tw';
  var tbl=document.createElement('table');
  var thead=document.createElement('thead'), hr=document.createElement('tr');
  headers.forEach(function(h){var th=document.createElement('th'); th.textContent=h; hr.appendChild(th);});
  thead.appendChild(hr); tbl.appendChild(thead);
  var tbody=document.createElement('tbody');
  if (!rows||!rows.length) {
    var tr=document.createElement('tr'), td=document.createElement('td');
    td.colSpan=headers.length; td.className='empty'; td.textContent='No data'; tr.appendChild(td); tbody.appendChild(tr);
  } else { rows.forEach(function(r){tbody.appendChild(r);}); }
  tbl.appendChild(tbody); wrap.appendChild(tbl); return wrap;
}

function mkRow(cells) {
  var tr=document.createElement('tr');
  cells.forEach(function(c){tr.appendChild(c);});
  return tr;
}

function mkTd(text,cls) {
  var td=document.createElement('td');
  td.textContent=text||'–';
  if(cls)td.className=cls;
  return td;
}

function mkBdgTd(s) {
  var td=document.createElement('td');
  td.appendChild(mkBadge(s));
  return td;
}

// ── Render ────────────────────────────────────────────────────────
function renderTab() {
  var el=$('tabContent'); el.innerHTML='';
  try {
    var cp=allData.chargePoints||[], locs=allData.locations||[];
    var active=allData.activeSessions||[], sess=allData.sessions||[];
    var usrs=allData.users||[], txns=allData.transactions||[], evses=allData.evses||[];
    var ym=allData._month||getYM();
    var mLabel=new Date(ym+'-15').toLocaleString('default',{month:'long',year:'numeric'});

    if (currentTab==='overview') {
      var cpOnline=cp.filter(function(c){return ['online','available','charging'].indexOf((c.connectivity_status||c.status||'').toLowerCase())>=0;}).length;
      var sessCount=allData._sessCount!=null?allData._sessCount:sess.length;
      var energy=allData._totalEnergy!=null?allData._totalEnergy/1000:sess.reduce(function(a,s){return a+parseFloat(s.energy||0);},0)/1000;
      var revenue=allData._totalRevenue!=null?allData._totalRevenue:txns.reduce(function(a,t){return a+parseFloat(t.totalAmount||t.amount||0);},0);

      var cards=document.createElement('div'); cards.className='cards';
      [mkCard('🔌','Charge Points',cp.length.toLocaleString(),'#00c2a8',cpOnline+' active'),
       mkCard('📍','Locations',locs.length.toLocaleString(),'#3b82f6'),
       mkCard('⚡','Active Now',active.length,'#a78bfa'),
       mkCard('📋','Sessions '+mLabel,sessCount.toLocaleString(),'#06b6d4'),
       mkCard('🔋','Energy kWh',energy.toFixed(1),'#f59e0b',mLabel),
       mkCard('💰','Revenue','$'+revenue.toFixed(2),'#10b981',mLabel),
       mkCard('👤','Total Users',usrs.length.toLocaleString(),'#f97316')
      ].forEach(function(c){cards.appendChild(c);}); el.appendChild(cards);

      if (active.length) {
        var sec=document.createElement('div'); sec.className='sec';
        var t=document.createElement('div'); t.className='stitle'; t.textContent='⚡ Live Active Sessions ('+active.length+')'; sec.appendChild(t);
        var rows=active.map(function(s){return mkRow([mkTd(s.id,'mono'),mkTd(s.chargePointId||'–','muted'),mkTd(s.userId||'–','muted'),mkTd(fmt(s.startedAt),'muted'),mkTd((parseFloat(s.energy||0)/1000).toFixed(2))]);});
        sec.appendChild(mkTable(['Session','Charge Point','User','Started','kWh'],rows)); el.appendChild(sec);
      }

      var statusCounts=cp.reduce(function(a,c){var s=c.connectivity_status||c.status||'unknown';a[s]=(a[s]||0)+1;return a;},{});
      if (Object.keys(statusCounts).length) {
        var sec=document.createElement('div'); sec.className='sec';
        var t=document.createElement('div'); t.className='stitle'; t.textContent='Charge Point Status'; sec.appendChild(t);
        var grid=document.createElement('div'); grid.className='sgrid';
        Object.keys(statusCounts).forEach(function(s){var box=document.createElement('div'); box.className='sbox'; box.appendChild(mkBadge(s)); var num=document.createElement('div'); num.className='snum'; num.textContent=statusCounts[s]; box.appendChild(num); grid.appendChild(box);});
        sec.appendChild(grid); el.appendChild(sec);
      }

      var locSess=sess.reduce(function(a,s){var id=s.locationId||s.location_id;if(id){a[id]=(a[id]||0)+1;}return a;},{});
      var topLocs=Object.keys(locSess).map(function(k){return [k,locSess[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
      if (topLocs.length) {
        var max=topLocs[0][1];
        var pw=document.createElement('div'); pw.className='pw';
        var t=document.createElement('div'); t.className='stitle'; t.textContent='Top Locations — '+mLabel; pw.appendChild(t);
        topLocs.forEach(function(entry){
          var loc=locs.filter(function(l){return String(l.id)===String(entry[0]);})[0];
          var item=document.createElement('div'); item.className='pi';
          var row=document.createElement('div'); row.className='pr';
          var lbl=document.createElement('span'); lbl.textContent=loc?n(loc.name):'Location '+entry[0];
          var val=document.createElement('span'); val.style.color='#8892a4'; val.textContent=entry[1]+' sessions';
          row.appendChild(lbl); row.appendChild(val);
          var track=document.createElement('div'); track.className='pt';
          var fill=document.createElement('div'); fill.className='pf'; fill.style.width=Math.round(entry[1]/max*100)+'%';
          track.appendChild(fill); item.appendChild(row); item.appendChild(track); pw.appendChild(item);
        }); el.appendChild(pw);
      }

      if (locs.length) {
        var sec=document.createElement('div'); sec.className='sec';
        var t=document.createElement('div'); t.className='stitle'; t.textContent='Locations ('+locs.length.toLocaleString()+')'; sec.appendChild(t);
        var grid=document.createElement('div'); grid.className='grid';
        locs.slice(0,24).forEach(function(l){
          var c=document.createElement('div'); c.className='lcard';
          c.innerHTML='<div style="font-weight:700;font-size:15px;margin-bottom:6px">📍 '+n(l.name)+'</div>'
            +'<div style="color:#8892a4;font-size:12px">'+([n(l.address),l.city,l.region,l.country].filter(Boolean).join(', ')||'–')+'</div>'
            +'<div style="color:#4b5563;font-size:11px">'+(l.external_id||'ID: '+l.id)+'</div>'
            +(l.public_charge_points!=null?'<div style="color:#00c2a8;font-size:12px;margin-top:6px">🔌 '+l.public_charge_points+' public CPs</div>':'');
          grid.appendChild(c);
        }); sec.appendChild(grid); el.appendChild(sec);
      }
      return;
    }

    if (currentTab==='chargepoints') {
      var rows=filterArr(cp,['id','serial_number']).map(function(c){return mkRow([mkTd(c.id,'mono'),mkTd(n(c.name)),mkTd(c.serial_number||'–','mono muted'),mkBdgTd(c.connectivity_status||c.status),mkTd(c.location_id||'–','muted'),mkTd(c.model||c.vendor||'–','muted')]);});
      el.appendChild(mkTable(['ID','Name','Serial','Status','Location','Model'],rows)); return;
    }

    if (currentTab==='evses') {
      var rows=filterArr(evses,['id','network_id','charge_point_id']).map(function(e){return mkRow([mkTd(e.id,'muted'),mkTd(e.network_id||e.evse_id||'–','mono'),mkBdgTd(e.status),mkTd(e.charge_point_id||e.chargePointId||'–','muted'),mkTd(e.connector_type||(e.connectors&&e.connectors[0]&&e.connectors[0].type)||'–','muted'),mkTd(e.max_power||'–','muted')]);});
      el.appendChild(mkTable(['ID','Network ID','Status','Charge Point','Connector','Max kW'],rows)); return;
    }

    if (currentTab==='sessions') {
      var combined=active.concat(sess), seen={};
      var deduped=combined.filter(function(s){if(seen[s.id])return false;seen[s.id]=true;return true;});
      var note=document.createElement('div'); note.style.cssText='color:#8892a4;font-size:12px;margin-bottom:10px';
      note.textContent='Showing '+mLabel+' + active sessions'; el.appendChild(note);
      var rows=filterArr(deduped,['id','status','chargePointId','userId']).slice(0,500).map(function(s){
        var dur=s.stoppedAt&&s.startedAt?Math.round((new Date(s.stoppedAt)-new Date(s.startedAt))/60000)+'m':'–';
        return mkRow([mkTd(s.id,'mono'),mkBdgTd(s.status),mkTd(fmt(s.startedAt),'muted'),mkTd((parseFloat(s.energy||0)/1000).toFixed(2)),mkTd(dur,'muted'),mkTd(s.chargePointId||'–','muted'),mkTd(s.userId||'–','muted'),mkTd(money(s.amount),'green')]);
      });
      el.appendChild(mkTable(['ID','Status','Started','kWh','Duration','Charge Point','User','Amount'],rows)); return;
    }

    if (currentTab==='locations') {
      var grid=document.createElement('div'); grid.className='grid';
      filterArr(locs,['city','country','post_code','region']).forEach(function(l){
        var c=document.createElement('div'); c.className='lcard';
        c.innerHTML='<div style="font-weight:700;font-size:15px;margin-bottom:6px">📍 '+n(l.name)+'</div>'
          +'<div style="color:#8892a4;font-size:12px;margin-bottom:4px">'+([n(l.address),l.city,l.region,l.country].filter(Boolean).join(', ')||'–')+'</div>'
          +'<div style="color:#4b5563;font-size:11px">'+(l.external_id||'ID: '+l.id)+'</div>'
          +(l.public_charge_points!=null?'<div style="color:#00c2a8;font-size:12px;margin-top:6px">🔌 '+l.public_charge_points+' public CPs</div>':'');
        grid.appendChild(c);
      }); el.appendChild(grid); return;
    }

    if (currentTab==='users') {
      var rows=filterArr(usrs,['id','email','first_name','last_name']).slice(0,500).map(function(u){
        var nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||n(u.name)||'–';
        return mkRow([mkTd(u.id,'muted'),mkTd(nm),mkTd(u.email||'–','muted'),mkBdgTd(u.status),mkTd(money(u.balance),'green'),mkTd(fmtD(u.created_at||u.createdAt),'muted')]);
      });
      el.appendChild(mkTable(['ID','Name','Email','Status','Balance','Created'],rows)); return;
    }

    if (currentTab==='transactions') {
      var note=document.createElement('div'); note.style.cssText='color:#8892a4;font-size:12px;margin-bottom:10px';
      note.textContent='Showing '+mLabel; el.appendChild(note);
      var rows=filterArr(txns,['id','sessionId','status']).slice(0,500).map(function(t){
        return mkRow([mkTd(t.id,'mono'),mkTd(t.sessionId||t.session_id||'–','mono muted'),mkTd(money(t.totalAmount||t.amount),'green'),mkTd(t.currency||'USD','muted'),mkBdgTd(t.status),mkTd(fmt(t.date||t.created_at),'muted')]);
      });
      el.appendChild(mkTable(['ID','Session','Amount','Currency','Status','Date'],rows));
    }
  } catch(e) {
    var div=document.createElement('div'); div.className='err';
    div.textContent='⚠️ Render error in "'+currentTab+'": '+e.message+'\n'+e.stack;
    el.appendChild(div); console.error(e);
  }
}

// ── Init ──────────────────────────────────────────────────────────
// Test localStorage immediately on page load
(function() {
  try {
    var testKey = 'ampeco_cache_test';
    var testVal = 'working_' + Date.now();
    localStorage.setItem(testKey, testVal);
    var readback = localStorage.getItem(testKey);
    localStorage.removeItem(testKey);
    if (readback === testVal) {
      console.log('[Cache Test] ✅ localStorage works fine');
    } else {
      console.error('[Cache Test] ❌ Write succeeded but readback was:', readback);
      alert('localStorage test FAILED: wrote "'+testVal+'" but got back "'+readback+'"');
    }
  } catch(e) {
    console.error('[Cache Test] ❌ Exception:', e);
    alert('localStorage EXCEPTION: '+e.name+': '+e.message);
  }
})();
buildMonthOptions();
</script>
