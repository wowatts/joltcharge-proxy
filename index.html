<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ampeco Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 20px; min-height: 100vh; }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .logo { background: #00c2a8; border-radius: 10px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { background: #00c2a8; color: #0d1117; border: none; border-radius: 9px; padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: #1a1f2e; color: #8892a4; border: 1px solid #2d3748; border-radius: 9px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .month-select { background: #1a1f2e; color: #e2e8f0; border: 1px solid #2d3748; border-radius: 9px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .badge { background: #00c2a818; color: #00c2a8; border: 1px solid #00c2a840; border-radius: 8px; padding: 4px 12px; font-size: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab { background: transparent; color: #8892a4; border: none; border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .tab.active { background: #00c2a8; color: #0d1117; }
  .tab-count { background: #ffffff18; border-radius: 99px; padding: 1px 6px; font-size: 10px; }
  .tab.active .tab-count { background: #0d111766; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .card { background: #1a1f2e; border-radius: 12px; padding: 18px 22px; flex: 1; min-width: 140px; }
  .card-icon { font-size: 24px; margin-bottom: 4px; }
  .card-label { color: #8892a4; font-size: 12px; margin-bottom: 4px; }
  .card-value { font-size: 28px; font-weight: 700; }
  .card-sub { color: #8892a4; font-size: 11px; margin-top: 4px; }
  .search { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px; padding: 8px 14px; color: #e2e8f0; font-size: 13px; width: 100%; margin-bottom: 14px; }
  .table-wrap { background: #1a1f2e; border-radius: 12px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 13px; text-align: left; font-weight: 600; background: #0d1117; color: #8892a4; font-size: 12px; white-space: nowrap; }
  tr:nth-child(even) td { background: #1e2535; }
  tr:nth-child(odd) td { background: #1a1f2e; }
  td { padding: 8px 13px; border-top: 1px solid #2d3748; }
  .mono { font-family: monospace; font-size: 11px; color: #8892a4; }
  .muted { color: #8892a4; }
  .bold { font-weight: 600; }
  .green { color: #10b981; font-weight: 600; }
  .badge-status { border-radius: 6px; padding: 2px 9px; font-size: 11px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .loc-card { background: #1a1f2e; border-radius: 12px; padding: 16px; }
  .loc-name { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .loc-addr { color: #8892a4; font-size: 12px; margin-bottom: 4px; }
  .loc-id { color: #4b5563; font-size: 11px; }
  .loc-cp { color: #00c2a8; font-size: 12px; margin-top: 6px; }
  .status-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .status-box { background: #0d1117; border-radius: 8px; padding: 10px 16px; text-align: center; }
  .status-num { font-weight: 700; font-size: 22px; margin-top: 6px; }
  .section { background: #1a1f2e; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .section-title { font-weight: 600; margin-bottom: 14px; }
  .progress-bar { background: #1a1f2e; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .progress-title { font-weight: 600; margin-bottom: 16px; color: #e2e8f0; }
  .progress-item { margin-bottom: 14px; }
  .progress-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
  .progress-track { background: #0d1117; border-radius: 99px; height: 6px; overflow: hidden; }
  .progress-fill { height: 6px; border-radius: 99px; transition: width 0.5s; }
  .empty { padding: 40px; text-align: center; color: #8892a4; }
  .spinner { text-align: center; padding: 40px; color: #8892a4; }
  .spinner-icon { font-size: 36px; display: inline-block; animation: spin 1.2s linear infinite; }
  .spinner-msg { font-size: 14px; margin-top: 10px; }
  .spinner-sub { font-size: 12px; color: #4b5563; margin-top: 4px; }
  .progress-log { margin-top: 12px; background: #0d1117; border-radius: 8px; padding: 10px 12px; max-height: 120px; overflow-y: auto; }
  .log-line { font-family: monospace; font-size: 11px; color: #8892a4; margin-bottom: 2px; }
  .log-ok { color: #00c2a8; }
  .log-err { color: #ef4444; }
  .error { background: #ef444418; border: 1px solid #ef444440; border-radius: 10px; padding: 14px; color: #ef4444; margin-bottom: 16px; font-size: 13px; }
  .month-label { background: #1a1f2e; border-radius: 8px; padding: 4px 12px; font-size: 12px; color: #8892a4; border: 1px solid #2d3748; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡</div>
  <div>
    <div style="font-weight:700;font-size:20px">Ampeco Dashboard</div>
    <div style="color:#4b5563;font-size:12px">joltcharge-us.us.charge.ampeco.tech</div>
  </div>
  <div class="header-right">
    <select class="month-select" id="monthSelect" onchange="onMonthChange()"></select>
    <button class="btn-ghost" id="clearCacheBtn" onclick="clearCurrentCache()" style="display:none;font-size:12px">🗑️ Clear Cache</button>
    <button class="btn" id="loadBtn" onclick="loadAll()">🔌 Load Data</button>
    <span class="badge" id="statusBadge" style="display:none">🟢 <span id="recordCount">0</span> records</span>
  </div>
</div>

<div id="errorEl" style="display:none" class="error"></div>

<div id="loadingEl" style="display:none" class="spinner">
  <div class="spinner-icon">⚡</div>
  <div class="spinner-msg" id="loadingMsg">Loading...</div>
  <div class="spinner-sub" id="loadingSub"></div>
  <div class="progress-log" id="debugLog"></div>
</div>

<div id="mainContent" style="display:none">
  <div class="tabs" id="tabs"></div>
  <input type="text" class="search" id="searchBox" placeholder="Search..." oninput="renderTab()" style="display:none" />
  <div id="tabContent"></div>
</div>

<script>
const PROXY = '/api/ampeco';
let allData = null;
let currentTab = 'overview';

// ── Month selector ──────────────────────────────────────────────
function buildMonthOptions() {
  const sel = document.getElementById('monthSelect');
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleString('default', { month: 'long', year: 'numeric' });
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = label;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  }
}

function getSelectedMonth() {
  return document.getElementById('monthSelect').value; // "YYYY-MM"
}

function monthRange(ym) {
  const [y, m] = ym.split('-').map(Number);
  const from = `${ym}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const to = `${ym}-${String(lastDay).padStart(2,'0')}`;
  return { from, to };
}

// ── Cache helpers ───────────────────────────────────────────────
function isFinalizedMonth(ym) {
  const now = new Date();
  const current = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  return ym < current;
}
function cacheKey(ym) { return `ampeco_month_${ym}`; }

function saveToCache(ym, data, lastFetchedAt) {
  try {
    localStorage.setItem(cacheKey(ym), JSON.stringify({ cachedAt: new Date().toISOString(), lastFetchedAt, data }));
    log(`💾 Saved ${ym} to cache`, 'log-ok');
  } catch(e) { log(`⚠️ Cache write failed: ${e.message}`); }
}

function loadFromCache(ym) {
  try {
    const raw = localStorage.getItem(cacheKey(ym));
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function clearCache(ym) {
  localStorage.removeItem(cacheKey(ym));
  log(`🗑️ Cleared cache for ${ym}`);
}

// Merge new records into existing array, dedup by id
function mergeRecords(existing, incoming) {
  const map = new Map(existing.map(r => [String(r.id), r]));
  for (const r of incoming) map.set(String(r.id), r); // incoming overwrites (more recent)
  return Array.from(map.values());
}

// Subtract 2h overlap from a timestamp string to catch late-arriving records
function withOverlap(isoString, overlapHours = 2) {
  const d = new Date(isoString);
  d.setTime(d.getTime() - overlapHours * 3600 * 1000);
  return d.toISOString().slice(0, 19).replace('T', ' ');
}

// ── Fetch helpers ───────────────────────────────────────────────
function log(msg, cls) {
  const el = document.getElementById('debugLog');
  const d = document.createElement('div');
  d.className = 'log-line' + (cls ? ' ' + cls : '');
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

async function fetchPages(path, maxPages = 50) {
  let all = [], page = 1, lastPage = 1;
  do {
    const sep = path.includes('?') ? '&' : '?';
    const url = `${PROXY}?path=${encodeURIComponent(path + sep + `per_page=100&page=${page}`)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const items = json.data ?? json.items ?? (Array.isArray(json) ? json : []);
    all = [...all, ...items];
    lastPage = json.meta?.last_page ?? 1;
    document.getElementById('loadingSub').textContent = `Page ${page}/${Math.min(lastPage, maxPages)}`;
    page++;
  } while (page <= lastPage && page <= maxPages);
  return all;
}

// ── Main load ───────────────────────────────────────────────────
async function loadAll() {
  const ym = getSelectedMonth();
  const { from, to } = monthRange(ym);
  const now = new Date().toISOString();

  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('errorEl').style.display = 'none';
  document.getElementById('loadingEl').style.display = 'block';
  document.getElementById('debugLog').innerHTML = '';
  document.getElementById('loadBtn').disabled = true;
  document.getElementById('statusBadge').style.display = 'none';

  const cached = loadFromCache(ym);
  const isIncremental = !!cached;
  const overlapFrom = cached?.lastFetchedAt ? withOverlap(cached.lastFetchedAt) : null;

  if (isIncremental) {
    const age = Math.round((Date.now() - new Date(cached.cachedAt)) / 60000);
    log(`📦 Cache found for ${ym} (${age < 60 ? age+'m' : Math.round(age/60)+'h'} old) — incremental update from ${overlapFrom}`, 'log-ok');
  } else {
    log(`🆕 No cache for ${ym} — full fetch`, 'log-ok');
  }

  // Start with cached data or empty
  const data = isIncremental ? { ...cached.data } : {
    locations: [], chargePoints: [], evses: [],
    sessions: [], transactions: [], users: [], activeSessions: []
  };

  // Always-live endpoints (never cached)
  const liveJobs = [
    { key: 'activeSessions', label: 'Active Sessions', path: `/resources/sessions/v1.0?filter[status][]=active&filter[status][]=pending`, max: 10 },
    { key: 'chargePoints',   label: 'Charge Points',   path: `/resources/charge-points/v1.0`, max: 100 },
  ];

  // Incremental endpoints — use overlap window if we have a previous fetch time
  // For full fetch, use the month range. For incremental, fetch only since last fetch (with overlap).
  const sessionFrom  = isIncremental ? overlapFrom : from;
  const txnFrom      = isIncremental ? overlapFrom : from;

  const incrementalJobs = [
    { key: 'sessions',     label: 'Sessions',     path: `/resources/sessions/v1.0?filter[startedAt][from]=${sessionFrom}&filter[startedAt][to]=${to}`, max: 50 },
    { key: 'transactions', label: 'Transactions', path: `/resources/transactions/v1.0?filter[createdAt][from]=${txnFrom}&filter[createdAt][to]=${to}`, max: 50 },
  ];

  // These change rarely — only re-fetch if cache is older than 24h or no cache
  const cacheAgeHours = cached ? (Date.now() - new Date(cached.cachedAt)) / 3600000 : 999;
  const staticJobs = cacheAgeHours > 24 || !isIncremental ? [
    { key: 'locations', label: 'Locations', path: `/resources/locations/v1.0`,   max: 100 },
    { key: 'evses',     label: 'EVSEs',     path: `/resources/evses/v1.0`,        max: 100 },
    { key: 'users',     label: 'Users',     path: `/resources/users/v1.0`,        max: 100 },
  ] : [];

  if (staticJobs.length === 0 && isIncremental) {
    log(`⏭️ Locations/EVSEs/Users unchanged (cache < 24h) — skipping`, 'log-ok');
  }

  const allJobs = [...liveJobs, ...incrementalJobs, ...staticJobs];

  for (const job of allJobs) {
    try {
      document.getElementById('loadingMsg').textContent = `Fetching ${job.label}...`;
      const fresh = await fetchPages(job.path, job.max);

      if (isIncremental && ['sessions','transactions'].includes(job.key)) {
        const before = (data[job.key]||[]).length;
        data[job.key] = mergeRecords(data[job.key] || [], fresh);
        const added = data[job.key].length - before;
        log(`✅ ${job.label}: +${added} new (${data[job.key].length} total)`, 'log-ok');
      } else {
        data[job.key] = fresh;
        log(`✅ ${job.label}: ${fresh.length} records`, 'log-ok');
      }
    } catch(e) {
      log(`❌ ${job.label}: ${e.message}`, 'log-err');
    }
  }

  // Save to cache (all months including current — so incremental works tomorrow)
  const toCache = { locations: data.locations, chargePoints: data.chargePoints, evses: data.evses, sessions: data.sessions, transactions: data.transactions, users: data.users };
  saveToCache(ym, toCache, now);

  allData = { ...data, _month: ym, _fromCache: isIncremental };
  finishLoad();
}

function finishLoad() {
  try {
    const total = Object.values(allData).reduce((a,b) => Array.isArray(b) ? a+b.length : a, 0);
    const cached = loadFromCache(allData._month);
    const ageMin = cached ? Math.round((Date.now() - new Date(cached.cachedAt)) / 60000) : 0;
    const ageStr = ageMin < 60 ? `${ageMin}m ago` : `${Math.round(ageMin/60)}h ago`;
    document.getElementById('recordCount').textContent = `${total.toLocaleString()} · synced ${ageStr}`;
    document.getElementById('statusBadge').style.display = '';
    document.getElementById('loadingEl').style.display = 'none';
    document.getElementById('welcomeEl') && (document.getElementById('welcomeEl').style.display = 'none');
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('loadBtn').textContent = '🔄 Refresh';
    document.getElementById('loadBtn').disabled = false;
    updateMonthLabels();
    buildTabs();
    switchTab('overview');
  } catch(e) {
    document.getElementById('loadingEl').style.display = 'none';
    document.getElementById('loadBtn').disabled = false;
    document.getElementById('loadBtn').textContent = '🔄 Refresh';
    document.getElementById('errorEl').style.display = 'block';
    document.getElementById('errorEl').textContent = '⚠️ UI error in finishLoad: ' + e.message;
    console.error('finishLoad error:', e);
  }
}

// ── UI helpers ──────────────────────────────────────────────────
const n = v => { if (!v) return '–'; if (typeof v === 'string') return v; return v.en ?? v[Object.keys(v)[0]] ?? '–'; };
const fmt = d => d ? new Date(d).toLocaleString() : '–';
const fmtDate = d => d ? new Date(d).toLocaleDateString() : '–';
const money = v => v != null ? `$${parseFloat(v).toFixed(2)}` : '–';

const SC = { available:'#00c2a8', charging:'#3b82f6', faulted:'#ef4444', unavailable:'#f59e0b', preparing:'#a78bfa', finishing:'#06b6d4', reserved:'#f97316', online:'#00c2a8', offline:'#8892a4', active:'#3b82f6', pending:'#f59e0b', finished:'#10b981', completed:'#10b981', unknown:'#8892a4' };
const badgeHtml = s => { const k=(s||'unknown').toLowerCase(); const c=SC[k]||'#8892a4'; return `<span class="badge-status" style="background:${c}22;color:${c};border:1px solid ${c}44">${s||'unknown'}</span>`; };

const TABS = [
  { key:'overview',     label:'Overview' },
  { key:'chargepoints', label:'Charge Points',  dk:'chargePoints' },
  { key:'evses',        label:'EVSEs',          dk:'evses' },
  { key:'sessions',     label:'Sessions',       dk:'sessions' },
  { key:'locations',    label:'Locations',      dk:'locations' },
  { key:'users',        label:'Users',          dk:'users' },
  { key:'transactions', label:'Transactions',   dk:'transactions' },
];

function buildTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const count = t.dk ? (allData[t.dk]||[]).length : '';
    return `<button class="tab ${t.key===currentTab?'active':''}" onclick="switchTab('${t.key}')">
      ${t.label}${count ? `<span class="tab-count">${count.toLocaleString()}</span>` : ''}
    </button>`;
  }).join('');
}

function switchTab(key) {
  currentTab = key;
  document.getElementById('searchBox').value = '';
  document.getElementById('searchBox').style.display = key === 'overview' ? 'none' : 'block';
  document.getElementById('searchBox').placeholder = `Search ${key}...`;
  buildTabs();
  renderTab();
}

function filterArr(arr, fields) {
  const q = document.getElementById('searchBox').value.toLowerCase();
  if (!q) return arr;
  return arr.filter(item => fields.some(f => String(item[f]||'').toLowerCase().includes(q)));
}

// ── Render ──────────────────────────────────────────────────────
function renderTab() {
  try {
    _renderTab();
  } catch(e) {
    document.getElementById('tabContent').innerHTML = `<div class="error">⚠️ Render error in tab "${currentTab}": ${e.message}<br><pre style="font-size:11px;margin-top:8px;color:#ef4444">${e.stack}</pre></div>`;
    console.error('renderTab error:', e);
  }
}

function _renderTab() {
  const el = document.getElementById('tabContent');
  const { chargePoints:cp=[], locations:locs=[], activeSessions:active=[], sessions:sess=[], users:usrs=[], transactions:txns=[], evses=[] } = allData || {};
  const ym = allData?._month || getSelectedMonth();
  const monthLabel = new Date(ym + '-15').toLocaleString('default', { month: 'long', year: 'numeric' });

  if (currentTab === 'overview') {
    const cpOnline = cp.filter(c => ['online','available','charging'].includes((c.connectivity_status||c.status||'').toLowerCase())).length;
    const totalEnergy = sess.reduce((a,s) => a + parseFloat(s.energy||0), 0) / 1000;
    const totalRev = txns.reduce((a,t) => a + parseFloat(t.amount||t.totalAmount?.withTax||0), 0);
    const statusCounts = cp.reduce((a,c) => { const s=c.connectivity_status||c.status||'unknown'; a[s]=(a[s]||0)+1; return a; }, {});

    // Top locations by session count
    const locSessions = sess.reduce((a,s) => { const id=s.locationId||s.location_id; if(id){a[id]=(a[id]||0)+1;} return a; }, {});
    const topLocs = Object.entries(locSessions).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const maxSess = topLocs[0]?.[1] || 1;

    el.innerHTML = `
      <div class="cards">
        <div class="card"><div class="card-icon">🔌</div><div class="card-label">Charge Points</div><div class="card-value" style="color:#00c2a8">${cp.length.toLocaleString()}</div><div class="card-sub">${cpOnline} active</div></div>
        <div class="card"><div class="card-icon">📍</div><div class="card-label">Locations</div><div class="card-value" style="color:#3b82f6">${locs.length.toLocaleString()}</div></div>
        <div class="card"><div class="card-icon">⚡</div><div class="card-label">Active Now</div><div class="card-value" style="color:#a78bfa">${active.length}</div></div>
        <div class="card"><div class="card-icon">📋</div><div class="card-label">Sessions in ${monthLabel}</div><div class="card-value" style="color:#06b6d4">${sess.length.toLocaleString()}</div></div>
        <div class="card"><div class="card-icon">🔋</div><div class="card-label">Energy ${monthLabel} (kWh)</div><div class="card-value" style="color:#f59e0b">${totalEnergy.toFixed(1)}</div></div>
        <div class="card"><div class="card-icon">💰</div><div class="card-label">Revenue ${monthLabel}</div><div class="card-value" style="color:#10b981">$${totalRev.toFixed(2)}</div></div>
        <div class="card"><div class="card-icon">👤</div><div class="card-label">Total Users</div><div class="card-value" style="color:#f97316">${usrs.length.toLocaleString()}</div></div>
      </div>

      ${active.length ? `
      <div class="section">
        <div class="section-title">⚡ Live Active Sessions (${active.length})</div>
        <div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr>${['Session ID','Charge Point','User','Started','Energy (kWh)'].map(h=>`<th style="padding:8px 12px;text-align:left;background:#0d1117;color:#8892a4;font-size:12px">${h}</th>`).join('')}</tr></thead>
          <tbody>${active.map((s,i)=>`<tr style="background:${i%2===0?'#1a1f2e':'#1e2535'}">
            <td style="padding:7px 12px;font-family:monospace;font-size:11px;color:#8892a4">${s.id}</td>
            <td style="padding:7px 12px;color:#8892a4">${s.chargePointId||'–'}</td>
            <td style="padding:7px 12px;color:#8892a4">${s.userId||'–'}</td>
            <td style="padding:7px 12px;color:#8892a4;font-size:12px">${fmt(s.startedAt)}</td>
            <td style="padding:7px 12px;font-weight:600">${(parseFloat(s.energy||0)/1000).toFixed(2)}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>` : ''}

      ${cp.length ? `<div class="section"><div class="section-title">Charge Point Status</div><div class="status-grid">${Object.entries(statusCounts).map(([s,cnt]) => `<div class="status-box">${badgeHtml(s)}<div class="status-num">${cnt}</div></div>`).join('')}</div></div>` : ''}

      ${topLocs.length ? `
      <div class="progress-bar">
        <div class="progress-title">Top Locations by Sessions — ${monthLabel}</div>
        ${topLocs.map(([id, cnt]) => {
          const loc = locs.find(l => String(l.id) === String(id));
          const label = loc ? n(loc.name) : `Location ${id}`;
          return `<div class="progress-item">
            <div class="progress-label"><span>${label}</span><span style="color:#8892a4">${cnt} sessions</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${Math.round(cnt/maxSess*100)}%;background:#00c2a8"></div></div>
          </div>`;
        }).join('')}
      </div>` : ''}

      ${locs.length ? `<div class="section"><div class="section-title">All Locations (${locs.length.toLocaleString()})</div><div class="grid">${locs.slice(0,24).map(l => `<div class="loc-card"><div class="loc-name">📍 ${n(l.name)}</div><div class="loc-addr">${[n(l.address),l.city,l.region,l.country].filter(Boolean).join(', ')||'–'}</div><div class="loc-id">${l.external_id||`ID: ${l.id}`}</div>${l.public_charge_points!=null?`<div class="loc-cp">🔌 ${l.public_charge_points} public CPs</div>`:''}</div>`).join('')}</div></div>` : ''}
    `;
    return;
  }

  if (currentTab === 'chargepoints') {
    const rows = filterArr(cp, ['id','serial_number','name']).map((c,i) =>
      `<tr><td class="mono">${c.id}</td><td class="bold">${n(c.name)}</td><td class="mono muted">${c.serial_number||'–'}</td><td>${badgeHtml(c.connectivity_status||c.status)}</td><td class="muted">${c.location_id||'–'}</td><td class="muted">${c.model||c.vendor||'–'}</td></tr>`
    ).join('');
    el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Serial</th><th>Status</th><th>Location ID</th><th>Model</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No results</td></tr>'}</tbody></table></div>`;
    return;
  }

  if (currentTab === 'evses') {
    const rows = filterArr(evses, ['id','network_id','status','charge_point_id']).map((e,i) =>
      `<tr><td class="muted">${e.id}</td><td class="mono">${e.network_id||e.evse_id||'–'}</td><td>${badgeHtml(e.status)}</td><td class="muted">${e.charge_point_id||e.chargePointId||'–'}</td><td class="muted">${e.connector_type||e.connectors?.[0]?.type||'–'}</td><td class="muted">${e.max_power||'–'}</td></tr>`
    ).join('');
    el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Network ID</th><th>Status</th><th>Charge Point</th><th>Connector</th><th>Max kW</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No EVSEs</td></tr>'}</tbody></table></div>`;
    return;
  }

  if (currentTab === 'sessions') {
    const combined = [...active, ...sess];
    const seen = new Set();
    const deduped = combined.filter(s => seen.has(s.id) ? false : seen.add(s.id));
    const rows = filterArr(deduped, ['id','status','chargePointId','userId']).slice(0,500).map((s,i) => {
      const dur = s.stoppedAt && s.startedAt ? Math.round((new Date(s.stoppedAt)-new Date(s.startedAt))/60000)+'m' : '–';
      return `<tr><td class="mono">${s.id}</td><td>${badgeHtml(s.status)}</td><td class="muted" style="font-size:12px">${fmt(s.startedAt)}</td><td class="bold">${(parseFloat(s.energy||0)/1000).toFixed(2)}</td><td class="muted">${dur}</td><td class="muted">${s.chargePointId||'–'}</td><td class="muted">${s.userId||'–'}</td><td class="green">${money(s.amount)}</td></tr>`;
    }).join('');
    el.innerHTML = `<div style="color:#8892a4;font-size:12px;margin-bottom:10px">Showing ${monthLabel} + active sessions</div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Status</th><th>Started</th><th>kWh</th><th>Duration</th><th>Charge Point</th><th>User</th><th>Amount</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No sessions</td></tr>'}</tbody></table></div>`;
    return;
  }

  if (currentTab === 'locations') {
    const rows = filterArr(locs, ['city','country','post_code','region']).map(l =>
      `<div class="loc-card"><div class="loc-name">📍 ${n(l.name)}</div><div class="loc-addr">${[n(l.address),l.city,l.region,l.country].filter(Boolean).join(', ')||'–'}</div><div class="loc-id">${l.external_id||''} · ID: ${l.id} · ${l.timezone||''}</div>${l.public_charge_points!=null?`<div class="loc-cp">🔌 ${l.public_charge_points} public CPs</div>`:''}</div>`
    ).join('');
    el.innerHTML = `<div class="grid">${rows||'<div class="empty">No locations</div>'}</div>`;
    return;
  }

  if (currentTab === 'users') {
    const rows = filterArr(usrs, ['id','email','first_name','last_name']).slice(0,500).map((u,i) =>
      `<tr><td class="muted">${u.id}</td><td class="bold">${[u.first_name,u.last_name].filter(Boolean).join(' ')||n(u.name)||'–'}</td><td class="muted">${u.email||'–'}</td><td>${badgeHtml(u.status)}</td><td class="green">${money(u.balance)}</td><td class="muted">${fmtDate(u.created_at||u.createdAt)}</td></tr>`
    ).join('');
    el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th><th>Balance</th><th>Created</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No users</td></tr>'}</tbody></table></div>`;
    return;
  }

  if (currentTab === 'transactions') {
    const rows = filterArr(txns, ['id','session_id','status']).slice(0,500).map((t,i) =>
      `<tr><td class="mono">${t.id}</td><td class="mono muted">${t.session_id||t.sessionId||'–'}</td><td class="green">${money(t.amount||t.totalAmount?.withTax)}</td><td class="muted">${t.currency||'USD'}</td><td>${badgeHtml(t.status||t.paymentStatus)}</td><td class="muted" style="font-size:12px">${fmt(t.created_at||t.createdAt)}</td></tr>`
    ).join('');
    el.innerHTML = `<div style="color:#8892a4;font-size:12px;margin-bottom:10px">Showing ${monthLabel}</div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Session</th><th>Amount</th><th>Currency</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No transactions</td></tr>'}</tbody></table></div>`;
    return;
  }
} // end _renderTab

// Init
buildMonthOptions();
updateMonthLabels();
</script>
</body>
</html>
