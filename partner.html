<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Partner Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e2e8f0;font-family:system-ui,sans-serif;padding:20px;min-height:100vh}
.header{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.logo{background:#00c2a8;border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.htitle{flex:1}
.htitle h1{font-weight:700;font-size:20px}
.htitle p{color:#4b5563;font-size:12px;margin-top:2px}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:#00c2a8;color:#0d1117;border:none;border-radius:9px;padding:8px 18px;font-weight:700;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gbtn{background:#1a1f2e;color:#8892a4;border:1px solid #2d3748;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
.sel{background:#1a1f2e;color:#e2e8f0;border:1px solid #2d3748;border-radius:9px;padding:8px 14px;font-size:13px}
.bdg{background:#00c2a818;color:#00c2a8;border:1px solid #00c2a840;border-radius:8px;padding:4px 12px;font-size:12px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card{background:#1a1f2e;border-radius:12px;padding:18px 22px;flex:1;min-width:140px}
.ci{font-size:26px;margin-bottom:6px}
.cl{color:#8892a4;font-size:12px;margin-bottom:4px}
.cv{font-size:30px;font-weight:700}
.cs{color:#8892a4;font-size:11px;margin-top:4px}
.sec{background:#1a1f2e;border-radius:12px;padding:20px;margin-bottom:16px}
.stitle{font-weight:600;font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.tw{overflow:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 13px;text-align:left;font-weight:600;background:#0d1117;color:#8892a4;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:#e2e8f0}
tr:nth-child(even) td{background:#1e2535}
tr:nth-child(odd) td{background:#1a1f2e}
td{padding:9px 13px;border-top:1px solid #2d3748}
.mono{font-family:monospace;font-size:11px;color:#8892a4}
.muted{color:#8892a4}
.green{color:#10b981;font-weight:600}
.teal{color:#00c2a8;font-weight:600}
.bs{border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600}
.sgrid{display:flex;gap:10px;flex-wrap:wrap}
.sbox{background:#0d1117;border-radius:8px;padding:10px 16px;text-align:center;min-width:90px}
.snum{font-weight:700;font-size:24px;margin-top:6px}
.pw{background:#1a1f2e;border-radius:12px;padding:20px;margin-bottom:16px}
.pi{margin-bottom:10px}
.pr{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px}
.pt{background:#0d1117;border-radius:99px;height:6px;overflow:hidden}
.pf{height:6px;border-radius:99px}
.spin-wrap{text-align:center;padding:80px;color:#8892a4}
.spin{font-size:40px;display:inline-block;animation:sp 1.2s linear infinite}
.prog{margin-top:16px;background:#1a1f2e;border-radius:10px;padding:14px;max-width:400px;margin-left:auto;margin-right:auto}
.prog-bar-wrap{background:#0d1117;border-radius:99px;height:8px;overflow:hidden;margin-top:8px}
.prog-bar{height:8px;border-radius:99px;background:#00c2a8;transition:width 0.3s}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:#8892a4;margin-top:6px}
.err{background:#ef444418;border:1px solid #ef444440;border-radius:10px;padding:14px;color:#ef4444;font-size:13px;margin-bottom:16px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00c2a8;margin-right:5px;animation:pulse 2s infinite}
.cache-info{font-size:11px;color:#4b5563}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<!-- Loading -->
<div class="spin-wrap" id="loadEl">
  <div class="spin">⚡</div>
  <div style="font-size:15px;margin-top:14px;font-weight:600" id="loadMsg">Loading...</div>
  <div class="prog" id="progWrap" style="display:none">
    <div style="font-size:13px;color:#e2e8f0" id="progLabel">Fetching...</div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
    <div class="prog-label"><span id="progSub"></span><span id="progPct">0%</span></div>
  </div>
</div>

<!-- Error -->
<div class="err" id="errEl" style="display:none"></div>

<!-- Dashboard -->
<div id="dashEl" style="display:none">
  <div class="header">
    <div class="logo">⚡</div>
    <div class="htitle">
      <h1 id="partnerName">Partner Dashboard</h1>
      <p id="partnerSub"></p>
    </div>
    <div class="hr">
      <select class="sel" id="monthSel" onchange="onMonthChange()"></select>
      <button class="gbtn" id="hardRefreshBtn" onclick="hardRefresh()" style="font-size:12px">🔄 Full Refresh</button>
      <button class="btn" id="refreshBtn" onclick="softRefresh()">⚡ Update</button>
      <span class="bdg" id="badge" style="display:none"><span class="live-dot"></span><span id="badgeTxt">Live</span></span>
    </div>
  </div>

  <div class="err" id="dataErr" style="display:none"></div>
  <div id="tabContent"></div>
</div>

<script>
var PROXY = '/api/ampeco';
var SC = {available:'#00c2a8',charging:'#3b82f6',faulted:'#ef4444',unavailable:'#f59e0b',preparing:'#a78bfa',online:'#00c2a8',offline:'#8892a4',active:'#3b82f6',pending:'#f59e0b',finished:'#10b981',completed:'#10b981',unknown:'#8892a4'};

var partnerId = null;
var partnerInfo = null;
var chargePoints = [];
var pageData = null; // current month's display data

function $(id){ return document.getElementById(id); }
function n(v){ if(!v)return '–'; if(typeof v==='string')return v; return v.en||v[Object.keys(v)[0]]||'–'; }
function fmt(d){ return d?new Date(d).toLocaleString():'–'; }
function money(v){ return v!=null ? '$'+parseFloat(v).toFixed(2) : '–'; }

function mkBadge(s){
  var k=(s||'unknown').toLowerCase(),c=SC[k]||'#8892a4';
  var el=document.createElement('span'); el.className='bs';
  el.style.cssText='background:'+c+'22;color:'+c+';border:1px solid '+c+'44';
  el.textContent=s||'unknown'; return el;
}

// ── Progress bar ───────────────────────────────────────────────
function showProg(label){ $('progWrap').style.display='block'; $('progLabel').textContent=label; setProg(0,''); }
function setProg(pct, sub){ $('progBar').style.width=pct+'%'; $('progPct').textContent=pct+'%'; $('progSub').textContent=sub||''; }
function hideProg(){ $('progWrap').style.display='none'; }

// ── Cache (per partner per month, stats only) ──────────────────
// Key: ampeco_p{partnerId}_{YYYY-MM}
// Value: { savedAt, lastFetch, cpStats: { cpId: {sessions, energyWh, revenue} }, cpList, locations }
function cKey(pid, ym){ return 'ampeco_p'+pid+'_'+ym; }

function saveCache(pid, ym, data){
  try {
    // Clear previous entries for this partner to save space
    var toDel=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.startsWith('ampeco_p'+pid+'_')) toDel.push(k);
    }
    toDel.forEach(function(k){localStorage.removeItem(k);});

    var payload = JSON.stringify({
      v:1, savedAt:new Date().toISOString(), lastFetch:data.lastFetch,
      cpStats:   data.cpStats,
      cpList:    data.cpList,
      locations: data.locations,
      activeSessions: data.activeSessions || []
    });
    localStorage.setItem(cKey(pid,ym), payload);
    var kb = Math.round(payload.length/1024);
    console.log('[Cache] Saved '+cKey(pid,ym)+' ('+kb+'KB)');
    return true;
  } catch(e){
    console.warn('[Cache] Save failed:', e.message);
    return false;
  }
}

function loadCache(pid, ym){
  try {
    var raw = localStorage.getItem(cKey(pid,ym));
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

// ── Month helpers ──────────────────────────────────────────────
function curYM(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function getYM(){ return $('monthSel').value||curYM(); }
function monthRange(ym){
  var p=ym.split('-'),y=parseInt(p[0]),m=parseInt(p[1]);
  return {from:ym+'-01',to:ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')};
}
function buildMonthOptions(){
  var sel=$('monthSel'); sel.innerHTML='';
  var now=new Date();
  for(var i=0;i<12;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var opt=document.createElement('option');
    opt.value=ym;
    opt.textContent=d.toLocaleString('default',{month:'long',year:'numeric'});
    if(i===0) opt.selected=true;
    sel.appendChild(opt);
  }
}

// ── API helpers ────────────────────────────────────────────────
async function apiFetch(path){
  var url = PROXY + '?path=' + encodeURIComponent(path);
  var res = await fetch(url);
  if (!res.ok){
    var b = await res.text();
    throw new Error('HTTP ' + res.status + ' — ' + path.split('?')[0] + ': ' + b.slice(0, 120));
  }
  return res.json();
}

async function getPages(path, max){
  max = max || 50;
  var all = [], page = 1, last = 1;
  do {
    // Pass per_page and page as separate query params to the proxy
    // so they don't get mixed into the path's filter params
    var url = PROXY + '?path=' + encodeURIComponent(path) + '&per_page=100&page=' + page;
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + path.split('?')[0]);
    var j = await res.json();
    var items = j.data || j.items || (Array.isArray(j) ? j : []);
    all = all.concat(items);
    last = (j.meta && j.meta.last_page) ? j.meta.last_page : 1;
    page++;
  } while (page <= last && page <= max);
  return all;
}

// Fetch sessions for ONE charge point and return {count, energyWh, revenue}
async function fetchCPStats(cpId, from, to){
  var path='/resources/sessions/v1.0?filter[chargePointId][]='+cpId
    +'&filter[startedAt][from]='+from+'&filter[startedAt][to]='+to;
  var sessions=await getPages(path, 20);
  var count=sessions.length;
  var energyWh=sessions.reduce(function(a,s){return a+parseFloat(s.energy||0);},0);
  var revenue=sessions.reduce(function(a,s){return a+parseFloat(s.amount||0);},0);
  return {count:count, energyWh:energyWh, revenue:revenue};
}

// Active sessions for one CP
async function fetchCPActive(cpId){
  var last24=new Date(Date.now()-24*3600000).toISOString().slice(0,10);
  var path='/resources/sessions/v1.0?filter[charge_point_id]='+cpId+'&filter[startedAt][from]='+last24;
  var sessions=await getPages(path,2);
  return sessions.filter(function(s){return s.status==='active'||s.status==='pending';});
}

// ── Init ───────────────────────────────────────────────────────
async function init(){
  partnerId=getParam('id');
  if(!partnerId){
    $('loadEl').style.display='none';
    $('errEl').textContent='⚠️ No partner ID in URL. Use: partner.html?id=13';
    $('errEl').style.display='block';
    return;
  }
  try {
    $('loadMsg').textContent='Loading partner...';
    var j=await apiFetch('/resources/partners/v2.0/'+partnerId);
    partnerInfo=j.data||j;
    var pname=partnerInfo.name||partnerInfo.companyName||'Partner '+partnerId;
    document.title=pname+' Dashboard';
    $('partnerName').textContent=pname;
    $('partnerSub').textContent=(partnerInfo.type?partnerInfo.type+' · ':'')+'Jolt Charge Network';

    $('loadMsg').textContent='Loading charge points...';
    chargePoints=await getPages('/resources/charge-points/v1.0?filter[partnerId]='+partnerId,20);

    buildMonthOptions();
    $('loadEl').style.display='none';
    $('dashEl').style.display='block';

    await loadMonth(false);
  } catch(e){
    $('loadEl').style.display='none';
    $('errEl').textContent='⚠️ '+e.message;
    $('errEl').style.display='block';
  }
}

function getParam(name){ return new URLSearchParams(window.location.search).get(name); }

function onMonthChange(){ loadMonth(false); }
function softRefresh(){  loadMonth(false); }
function hardRefresh(){
  // Clear cache for current month and re-fetch everything
  try { localStorage.removeItem(cKey(partnerId, getYM())); } catch(e){}
  loadMonth(true);
}

// ── Main load ──────────────────────────────────────────────────
async function loadMonth(forceRefresh){
  var ym=getYM(), range=monthRange(ym);
  var isCurrent = ym===curYM();
  var cached=loadCache(partnerId, ym);
  var cacheAgeMin = cached ? Math.round((Date.now()-new Date(cached.savedAt))/60000) : 9999;

  $('refreshBtn').disabled=true;
  $('hardRefreshBtn').disabled=true;
  $('badge').style.display='none';
  $('dataErr').style.display='none';

  // Show cached data instantly if available
  if(cached && !forceRefresh){
    var ageStr=cacheAgeMin<60?cacheAgeMin+'m ago':Math.round(cacheAgeMin/60)+'h ago';
    $('badgeTxt').textContent='cached '+ageStr;
    $('badge').style.display='';
    renderDashboard(cached, ym);
    $('refreshBtn').disabled=false;
    $('hardRefreshBtn').disabled=false;

    // For current month, always do a background update
    // For past months, only update if cache is older than 24h
    if(isCurrent || cacheAgeMin>1440){
      doUpdate(ym, range, cached);
    }
    return;
  }

  // No cache — full fetch with progress bar
  $('loadEl').style.display='block';
  $('dashEl').style.display='none';
  $('loadMsg').textContent='Fetching data for '+new Date(ym+'-15').toLocaleString('default',{month:'long',year:'numeric'})+'...';
  showProg('Loading charger stats');

  try {
    var result = await fetchAllStats(ym, range);
    saveCache(partnerId, ym, result);
    pageData=result;
    $('loadEl').style.display='none';
    $('dashEl').style.display='block';
    $('badgeTxt').textContent='just loaded';
    $('badge').style.display='';
    renderDashboard(result, ym);
  } catch(e){
    $('loadEl').style.display='none';
    $('dashEl').style.display='block';
    $('dataErr').textContent='⚠️ '+e.message;
    $('dataErr').style.display='block';
  }
  $('refreshBtn').disabled=false;
  $('hardRefreshBtn').disabled=false;
  hideProg();
}

// Background incremental update (doesn't block UI)
async function doUpdate(ym, range, cached){
  try {
    var result=await fetchAllStats(ym, range, cached);
    saveCache(partnerId, ym, result);
    pageData=result;
    var ageStr='just updated';
    $('badgeTxt').textContent=ageStr;
    renderDashboard(result, ym);
  } catch(e){
    console.warn('Background update failed:', e.message);
  }
}

// Fetch stats for all CPs, with progress
async function fetchAllStats(ym, range, cached){
  var cpList=chargePoints;
  var total=cpList.length;
  var cpStats={};

  // Determine which months need fresh data
  // For incremental: only re-fetch CPs where we have no data yet
  // (For simplicity we re-fetch all — but only counts/energy, not full records)
  for(var i=0;i<cpList.length;i++){
    var cp=cpList[i];
    setProg(Math.round((i/total)*80), 'Charger '+(i+1)+' of '+total+': '+n(cp.name));
    var stats=await fetchCPStats(cp.id, range.from, range.to);
    cpStats[String(cp.id)]=stats;
  }

  // Active sessions
  setProg(85,'Checking active sessions...');
  var activeSessions=[];
  for(var i=0;i<cpList.length;i++){
    var active=await fetchCPActive(cpList[i].id);
    activeSessions=activeSessions.concat(active);
  }

  // Locations
  setProg(95,'Loading locations...');
  var cpLocIds={};
  cpList.forEach(function(cp){if(cp.location_id)cpLocIds[String(cp.location_id)]=true;});
  var allLocs=await getPages('/resources/locations/v1.0',100);
  var locations=allLocs.filter(function(l){return cpLocIds[String(l.id)];});

  setProg(100,'Done!');
  return {cpStats:cpStats, cpList:cpList, locations:locations, activeSessions:activeSessions, lastFetch:new Date().toISOString()};
}

// ── Render ─────────────────────────────────────────────────────
function renderDashboard(data, ym){
  var el=$('tabContent'); el.innerHTML='';
  var mLabel=new Date(ym+'-15').toLocaleString('default',{month:'long',year:'numeric'});
  var cpList=data.cpList||chargePoints;
  var stats=data.cpStats||{};
  var active=data.activeSessions||[];
  var locs=data.locations||[];

  // Totals
  var totalSess=0,totalEnergy=0,totalRev=0;
  cpList.forEach(function(cp){
    var s=stats[String(cp.id)]||{};
    totalSess+=(s.count||0);
    totalEnergy+=(s.energyWh||0);
    totalRev+=(s.revenue||0);
  });
  var totalKwh=totalEnergy/1000;
  var avgKwh=totalSess>0?(totalKwh/totalSess).toFixed(2):'0.00';

  // CP status counts
  var statusCounts=cpList.reduce(function(a,c){var s=c.connectivity_status||c.status||'unknown';a[s]=(a[s]||0)+1;return a;},{});
  var cpOnline=cpList.filter(function(c){return ['online','available','charging'].indexOf((c.connectivity_status||c.status||'').toLowerCase())>=0;}).length;

  // ── KPI Cards ──
  var cards=document.createElement('div'); cards.className='cards';
  [{icon:'🔌',label:'Charge Points',  value:cpList.length,         color:'#00c2a8',sub:cpOnline+' online'},
   {icon:'📍',label:'Locations',       value:locs.length,           color:'#3b82f6'},
   {icon:'⚡',label:'Active Now',      value:active.length,         color:'#a78bfa'},
   {icon:'📋',label:'Sessions',        value:totalSess,             color:'#06b6d4',sub:mLabel},
   {icon:'🔋',label:'Energy (kWh)',    value:totalKwh.toFixed(1),   color:'#f59e0b',sub:'avg '+avgKwh+' kWh · '+mLabel},
   {icon:'💰',label:'Revenue',         value:'$'+totalRev.toFixed(2),color:'#10b981',sub:mLabel},
  ].forEach(function(c){
    var d=document.createElement('div'); d.className='card';
    d.innerHTML='<div class="ci">'+c.icon+'</div><div class="cl">'+c.label+'</div>'
      +'<div class="cv" style="color:'+c.color+'">'+c.value+'</div>'
      +(c.sub?'<div class="cs">'+c.sub+'</div>':'');
    cards.appendChild(d);
  }); el.appendChild(cards);

  // ── Active Sessions ──
  if(active.length){
    var sec=mkSec('⚡ Currently Charging ('+active.length+')');
    var rows=active.map(function(s){
      return mkTRow([mkTd(s.id,'mono'),mkTd(cpName(cpList,s.chargePointId),'muted'),mkTd(fmt(s.startedAt),'muted'),mkTd((parseFloat(s.energy||0)/1000).toFixed(2),'teal')]);
    });
    sec.appendChild(mkTable(['Session ID','Charger','Started','kWh'],rows));
    el.appendChild(sec);
  }

  // ── Per-Charger Stats Table ──
  var sec=mkSec('Charger Stats — '+mLabel);
  var sorted=cpList.slice().sort(function(a,b){
    return ((stats[String(b.id)]||{}).count||0)-((stats[String(a.id)]||{}).count||0);
  });
  var rows=sorted.map(function(cp){
    var s=stats[String(cp.id)]||{count:0,energyWh:0,revenue:0};
    var kwh=(s.energyWh/1000).toFixed(1);
    var avgKwhCP=s.count>0?(s.energyWh/1000/s.count).toFixed(2):'–';
    return mkTRow([
      mkTd(n(cp.name)||cp.serial_number||'CP '+cp.id),
      mkBdgTd(cp.connectivity_status||cp.status),
      mkTd(s.count,'teal'),
      mkTd(kwh,'teal'),
      mkTd(avgKwhCP,'muted'),
      mkTd('$'+s.revenue.toFixed(2),'green'),
    ]);
  });
  sec.appendChild(mkTable(['Charger','Status','Sessions','kWh','Avg kWh','Revenue'],rows));
  el.appendChild(sec);

  // ── CP Status Breakdown ──
  var sec2=mkSec('Charger Status');
  var sg=document.createElement('div'); sg.className='sgrid';
  Object.keys(statusCounts).forEach(function(s){
    var box=document.createElement('div'); box.className='sbox';
    box.appendChild(mkBadge(s));
    var num=document.createElement('div'); num.className='snum'; num.textContent=statusCounts[s];
    box.appendChild(num); sg.appendChild(box);
  });
  sec2.appendChild(sg); el.appendChild(sec2);

  // ── Sessions by Charger Bar Chart ──
  if(totalSess>0){
    var pw=document.createElement('div'); pw.className='pw';
    var t=document.createElement('div'); t.className='stitle'; t.textContent='Sessions by Charger — '+mLabel; pw.appendChild(t);
    var sortedBysess=cpList.slice().sort(function(a,b){return ((stats[String(b.id)]||{}).count||0)-((stats[String(a.id)]||{}).count||0);});
    var maxSess=(stats[String(sortedBysess[0].id)]||{}).count||1;
    sortedBysess.forEach(function(cp){
      var s=stats[String(cp.id)]||{};
      if(!s.count) return;
      var item=document.createElement('div'); item.className='pi';
      var row=document.createElement('div'); row.className='pr';
      var lbl=document.createElement('span'); lbl.textContent=n(cp.name)||'CP '+cp.id;
      var val=document.createElement('span'); val.style.color='#8892a4'; val.textContent=s.count+' sessions · '+(s.energyWh/1000).toFixed(1)+' kWh';
      row.appendChild(lbl); row.appendChild(val);
      var track=document.createElement('div'); track.className='pt';
      var fill=document.createElement('div'); fill.className='pf';
      fill.style.width=Math.round(s.count/maxSess*100)+'%';
      fill.style.background='#00c2a8';
      track.appendChild(fill); item.appendChild(row); item.appendChild(track); pw.appendChild(item);
    });
    el.appendChild(pw);
  }

  // ── Energy by Charger Bar Chart ──
  if(totalEnergy>0){
    var pw2=document.createElement('div'); pw2.className='pw';
    var t2=document.createElement('div'); t2.className='stitle'; t2.textContent='Energy (kWh) by Charger — '+mLabel; pw2.appendChild(t2);
    var sortedByEnergy=cpList.slice().sort(function(a,b){return ((stats[String(b.id)]||{}).energyWh||0)-((stats[String(a.id)]||{}).energyWh||0);});
    var maxE=(stats[String(sortedByEnergy[0].id)]||{}).energyWh||1;
    sortedByEnergy.forEach(function(cp){
      var s=stats[String(cp.id)]||{};
      if(!s.energyWh) return;
      var kwh=(s.energyWh/1000).toFixed(1);
      var item=document.createElement('div'); item.className='pi';
      var row=document.createElement('div'); row.className='pr';
      var lbl=document.createElement('span'); lbl.textContent=n(cp.name)||'CP '+cp.id;
      var val=document.createElement('span'); val.style.color='#8892a4'; val.textContent=kwh+' kWh';
      row.appendChild(lbl); row.appendChild(val);
      var track=document.createElement('div'); track.className='pt';
      var fill=document.createElement('div'); fill.className='pf';
      fill.style.width=Math.round(s.energyWh/maxE*100)+'%';
      fill.style.background='#f59e0b';
      track.appendChild(fill); item.appendChild(row); item.appendChild(track); pw2.appendChild(item);
    });
    el.appendChild(pw2);
  }

  // ── Locations ──
  if(locs.length){
    var sec3=mkSec('Locations');
    var grid=document.createElement('div');
    grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px';
    locs.forEach(function(l){
      var c=document.createElement('div');
      c.style.cssText='background:#0d1117;border-radius:10px;padding:14px';
      c.innerHTML='<div style="font-weight:700;font-size:14px;margin-bottom:6px">📍 '+n(l.name)+'</div>'
        +'<div style="color:#8892a4;font-size:12px">'+([n(l.address),l.city,l.region,l.country].filter(Boolean).join(', ')||'–')+'</div>';
      grid.appendChild(c);
    });
    sec3.appendChild(grid); el.appendChild(sec3);
  }
}

// ── Table helpers ──────────────────────────────────────────────
function mkSec(title){
  var s=document.createElement('div'); s.className='sec';
  var t=document.createElement('div'); t.className='stitle'; t.textContent=title;
  s.appendChild(t); return s;
}
function mkTable(headers,rows){
  var wrap=document.createElement('div'); wrap.className='tw';
  var tbl=document.createElement('table');
  var thead=document.createElement('thead'),hr=document.createElement('tr');
  headers.forEach(function(h){var th=document.createElement('th');th.textContent=h;hr.appendChild(th);});
  thead.appendChild(hr); tbl.appendChild(thead);
  var tbody=document.createElement('tbody');
  if(!rows||!rows.length){var tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=headers.length;td.style.cssText='padding:30px;text-align:center;color:#8892a4';td.textContent='No data';tr.appendChild(td);tbody.appendChild(tr);}
  else rows.forEach(function(r){tbody.appendChild(r);});
  tbl.appendChild(tbody); wrap.appendChild(tbl); return wrap;
}
function mkTRow(cells){var tr=document.createElement('tr');cells.forEach(function(c){tr.appendChild(c);});return tr;}
function mkTd(text,cls){var td=document.createElement('td');td.textContent=text!=null?text:'–';if(cls)td.className=cls;return td;}
function mkBdgTd(s){var td=document.createElement('td');td.appendChild(mkBadge(s));return td;}
function cpName(list,id){
  var c=list.filter(function(x){return String(x.id)===String(id);})[0];
  return c?(n(c.name)||c.serial_number||'CP '+id):'CP '+id;
}

// ── Start ──────────────────────────────────────────────────────
init();
</script>
