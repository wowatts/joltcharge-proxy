<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Partner Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e2e8f0;font-family:system-ui,sans-serif;padding:20px;min-height:100vh}
.header{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.logo{background:#00c2a8;border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.htitle{flex:1}
.htitle h1{font-weight:700;font-size:20px}
.htitle p{color:#4b5563;font-size:12px;margin-top:2px}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:#00c2a8;color:#0d1117;border:none;border-radius:9px;padding:8px 18px;font-weight:700;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sel{background:#1a1f2e;color:#e2e8f0;border:1px solid #2d3748;border-radius:9px;padding:8px 14px;font-size:13px}
.bdg{background:#00c2a818;color:#00c2a8;border:1px solid #00c2a840;border-radius:8px;padding:4px 12px;font-size:12px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card{background:#1a1f2e;border-radius:12px;padding:18px 22px;flex:1;min-width:150px}
.ci{font-size:26px;margin-bottom:6px}
.cl{color:#8892a4;font-size:12px;margin-bottom:4px}
.cv{font-size:30px;font-weight:700}
.cs{color:#8892a4;font-size:11px;margin-top:4px}
.sec{background:#1a1f2e;border-radius:12px;padding:20px;margin-bottom:16px}
.stitle{font-weight:600;font-size:15px;margin-bottom:14px}
.tw{background:#1a1f2e;border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 13px;text-align:left;font-weight:600;background:#0d1117;color:#8892a4;font-size:12px;white-space:nowrap}
tr:nth-child(even) td{background:#1e2535}
tr:nth-child(odd) td{background:#1a1f2e}
td{padding:8px 13px;border-top:1px solid #2d3748}
.mono{font-family:monospace;font-size:11px;color:#8892a4}
.muted{color:#8892a4}
.green{color:#10b981;font-weight:600}
.red{color:#ef4444}
.bs{border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600}
.sgrid{display:flex;gap:10px;flex-wrap:wrap}
.sbox{background:#0d1117;border-radius:8px;padding:10px 16px;text-align:center;min-width:90px}
.snum{font-weight:700;font-size:24px;margin-top:6px}
.pw{background:#1a1f2e;border-radius:12px;padding:20px;margin-bottom:16px}
.pi{margin-bottom:12px}
.pr{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px}
.pt{background:#0d1117;border-radius:99px;height:6px;overflow:hidden}
.pf{height:6px;border-radius:99px;background:#00c2a8}
.spin-wrap{text-align:center;padding:80px;color:#8892a4}
.spin{font-size:40px;display:inline-block;animation:sp 1.2s linear infinite}
.step{font-size:13px;color:#8892a4;margin-top:8px}
.step span{color:#00c2a8;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{background:transparent;color:#8892a4;border:none;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
.tab.active{background:#00c2a8;color:#0d1117}
.empty{padding:40px;text-align:center;color:#8892a4}
.err{background:#ef444418;border:1px solid #ef444440;border-radius:10px;padding:14px;color:#ef4444;font-size:13px;margin-bottom:16px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00c2a8;margin-right:6px;animation:pulse 2s infinite}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div class="spin-wrap" id="loadEl">
  <div class="spin">⚡</div>
  <div style="font-size:15px;margin-top:14px;font-weight:600" id="loadMsg">Loading...</div>
  <div class="step" id="loadStep"></div>
</div>

<div class="err" id="errEl" style="display:none"></div>

<div id="dashEl" style="display:none">
  <div class="header">
    <div class="logo">⚡</div>
    <div class="htitle">
      <h1 id="partnerName">Partner Dashboard</h1>
      <p id="partnerSub"></p>
    </div>
    <div class="hr">
      <select class="sel" id="monthSel" onchange="loadData()"></select>
      <button class="btn" id="refreshBtn" onclick="loadData()">🔄 Refresh</button>
      <span class="bdg" id="badge" style="display:none">
        <span class="live-dot"></span>Live
      </span>
    </div>
  </div>

  <div class="err" id="dataErr" style="display:none"></div>
  <div class="tabs" id="tabsEl"></div>
  <div id="tabContent"></div>
</div>

<script>
var PROXY = '/api/ampeco';
var SC = {available:'#00c2a8',charging:'#3b82f6',faulted:'#ef4444',unavailable:'#f59e0b',preparing:'#a78bfa',finishing:'#06b6d4',online:'#00c2a8',offline:'#8892a4',active:'#3b82f6',pending:'#f59e0b',finished:'#10b981',completed:'#10b981',suspended:'#f59e0b',unknown:'#8892a4'};
var TABS = [
  {key:'overview',     label:'Overview'},
  {key:'chargers',     label:'Chargers',      dk:'chargePoints'},
  {key:'sessions',     label:'Sessions',      dk:'sessions'},
  {key:'transactions', label:'Transactions',  dk:'transactions'},
  {key:'locations',    label:'Locations',     dk:'locations'},
];

var partnerId = null;
var cpIds = [];
var cpIdSet = {};
var pageData = null;
var currentTab = 'overview';

function $(id){ return document.getElementById(id); }
function n(v){ if(!v)return '–'; if(typeof v==='string')return v; return v.en||v[Object.keys(v)[0]]||'–'; }
function fmt(d){ return d?new Date(d).toLocaleString():'–'; }
function money(v){ return (v!=null&&v!=='') ? '$'+parseFloat(v).toFixed(2) : '–'; }
function step(s){ $('loadStep').innerHTML = s; }

function mkBadge(s){
  var k=(s||'unknown').toLowerCase(), c=SC[k]||'#8892a4';
  var el=document.createElement('span'); el.className='bs';
  el.style.cssText='background:'+c+'22;color:'+c+';border:1px solid '+c+'44';
  el.textContent=s||'unknown'; return el;
}

// ── URL param ──────────────────────────────────────────────────
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

// ── Month helpers ──────────────────────────────────────────────
function curYM(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function getYM(){ return $('monthSel').value||curYM(); }
function monthRange(ym){
  var p=ym.split('-'),y=parseInt(p[0]),m=parseInt(p[1]);
  return {from:ym+'-01',to:ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')};
}
function buildMonthOptions(){
  var sel=$('monthSel'); sel.innerHTML='';
  var now=new Date();
  for(var i=0;i<12;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var opt=document.createElement('option');
    opt.value=ym;
    opt.textContent=d.toLocaleString('default',{month:'long',year:'numeric'});
    if(i===0)opt.selected=true;
    sel.appendChild(opt);
  }
}

// ── Fetch ──────────────────────────────────────────────────────
async function apiFetch(path){
  var url=PROXY+'?path='+encodeURIComponent(path);
  var res=await fetch(url);
  if(!res.ok){
    var body=await res.text();
    throw new Error('HTTP '+res.status+' — '+path.split('?')[0]+': '+body.slice(0,120));
  }
  return res.json();
}

async function getPages(path, max){
  max=max||50;
  var all=[],page=1,last=1;
  do {
    var sep=path.indexOf('?')>=0?'&':'?';
    var j=await apiFetch(path+sep+'per_page=100&page='+page);
    var items=j.data||j.items||(Array.isArray(j)?j:[]);
    all=all.concat(items);
    last=(j.meta&&j.meta.last_page)?j.meta.last_page:1;
    page++;
  } while(page<=last&&page<=max);
  return all;
}

// ── Session fetch: one page at a time per CP ID to keep URLs short ─
async function fetchSessionsForCPs(cpIds, from, to){
  // Use chargePointId filter one at a time — no long URL
  var all={};
  for(var i=0;i<cpIds.length;i++){
    step('Loading sessions for charger '+(i+1)+' of '+cpIds.length+' <span>(CP '+cpIds[i]+')</span>');
    var path='/resources/sessions/v1.0?filter[chargePointId][]='+cpIds[i]
      +'&filter[startedAt][from]='+from+'&filter[startedAt][to]='+to;
    try {
      var sess=await getPages(path, 20);
      sess.forEach(function(s){ all[s.id]=s; });
    } catch(e){ console.warn('Sessions CP '+cpIds[i]+':',e.message); }
  }
  return Object.values(all);
}

async function fetchActiveForCPs(cpIds){
  var last24=new Date(Date.now()-24*3600000).toISOString().slice(0,10);
  var all={};
  for(var i=0;i<cpIds.length;i++){
    var path='/resources/sessions/v1.0?filter[chargePointId][]='+cpIds[i]
      +'&filter[startedAt][from]='+last24;
    try {
      var sess=await getPages(path,2);
      sess.filter(function(s){return s.status==='active'||s.status==='pending';})
          .forEach(function(s){all[s.id]=s;});
    } catch(e){}
  }
  return Object.values(all);
}

// ── Init ───────────────────────────────────────────────────────
async function init(){
  partnerId = getParam('id');
  if(!partnerId){
    $('loadEl').style.display='none';
    $('errEl').textContent='⚠️ No partner ID in URL. Use: partner.html?id=13';
    $('errEl').style.display='block';
    return;
  }

  try {
    step('Fetching partner info...');
    var j=await apiFetch('/resources/partners/v2.0/'+partnerId);
    var p=j.data||j;
    var pname=p.name||p.companyName||'Partner '+partnerId;
    document.title=pname+' Dashboard';
    $('partnerName').textContent=pname;
    $('partnerSub').textContent=(p.type?p.type+' · ':'')+'Jolt Charge Network';

    step('Fetching charge points...');
    var cps=await getPages('/resources/charge-points/v1.0?filter[partnerId]='+partnerId,20);
    cpIds=cps.map(function(c){return c.id;});
    cpIdSet={};
    cpIds.forEach(function(id){cpIdSet[String(id)]=true;});

    buildMonthOptions();
    $('loadEl').style.display='none';
    $('dashEl').style.display='block';
    await loadData(cps);

  } catch(e){
    $('loadEl').style.display='none';
    $('errEl').textContent='⚠️ '+e.message;
    $('errEl').style.display='block';
  }
}

// ── Load month data ────────────────────────────────────────────
async function loadData(preloadedCPs){
  if(!cpIds.length) return;
  var ym=getYM(), range=monthRange(ym);

  $('badge').style.display='none';
  $('refreshBtn').disabled=true;
  $('dataErr').style.display='none';
  $('tabContent').innerHTML='<div class="spin-wrap"><div class="spin" style="font-size:28px">⚡</div><div class="step" id="loadStep" style="margin-top:10px">Starting...</div></div>';

  function s(msg){ var el=$('loadStep'); if(el) el.innerHTML=msg; }

  try {
    // 1. Charge points (reuse if preloaded)
    var chargePoints;
    if(preloadedCPs){
      chargePoints=preloadedCPs;
    } else {
      s('Refreshing charge points...');
      chargePoints=await getPages('/resources/charge-points/v1.0?filter[partnerId]='+partnerId,20);
    }

    // 2. Locations — filter by CP location IDs
    s('Loading locations...');
    var cpLocIds={};
    chargePoints.forEach(function(cp){if(cp.location_id)cpLocIds[String(cp.location_id)]=true;});
    var allLocs=await getPages('/resources/locations/v1.0',100);
    var locations=allLocs.filter(function(l){return cpLocIds[String(l.id)];});

    // 3. Sessions — one CP at a time (avoids 422 from long URLs)
    var sessions=await fetchSessionsForCPs(cpIds, range.from, range.to);

    // 4. Active sessions
    s('Checking active sessions...');
    var activeSessions=await fetchActiveForCPs(cpIds);

    // 5. Transactions — match to session IDs client-side
    s('Loading transactions...');
    var sessIdSet={};
    sessions.forEach(function(s){sessIdSet[String(s.id)]=true;});
    // Also include active sessions
    activeSessions.forEach(function(s){sessIdSet[String(s.id)]=true;});

    var allTxns=await getPages(
      '/resources/transactions/v1.0?filter[date][from]='+range.from+'&filter[date][to]='+range.to,
      100
    );
    var transactions=allTxns.filter(function(t){
      return sessIdSet[String(t.sessionId)]||sessIdSet[String(t.session_id)];
    });

    pageData={chargePoints:chargePoints,locations:locations,sessions:sessions,activeSessions:activeSessions,transactions:transactions,month:ym};

    $('badge').style.display='';
    $('refreshBtn').disabled=false;
    buildTabs();
    switchTab(currentTab);

  } catch(e){
    $('dataErr').textContent='⚠️ '+e.message;
    $('dataErr').style.display='block';
    $('tabContent').innerHTML='';
    $('refreshBtn').disabled=false;
  }
}

// ── Tabs ───────────────────────────────────────────────────────
function buildTabs(){
  var el=$('tabsEl'); el.innerHTML='';
  TABS.forEach(function(t){
    var btn=document.createElement('button');
    btn.className='tab'+(t.key===currentTab?' active':'');
    btn.onclick=function(){switchTab(t.key);};
    btn.textContent=t.label;
    if(t.dk&&pageData&&pageData[t.dk]){
      var cnt=pageData[t.dk].length;
      if(cnt) btn.textContent+=' ('+cnt+')';
    }
    el.appendChild(btn);
  });
}

function switchTab(key){
  currentTab=key;
  buildTabs();
  renderTab();
}

// ── Render ─────────────────────────────────────────────────────
function renderTab(){
  var el=$('tabContent'); el.innerHTML='';
  if(!pageData) return;
  var cp=pageData.chargePoints||[],locs=pageData.locations||[];
  var sess=pageData.sessions||[],active=pageData.activeSessions||[];
  var txns=pageData.transactions||[];
  var ym=pageData.month||getYM();
  var mLabel=new Date(ym+'-15').toLocaleString('default',{month:'long',year:'numeric'});

  try {
    if(currentTab==='overview'){
      var cpOnline=cp.filter(function(c){return ['online','available','charging'].indexOf((c.connectivity_status||c.status||'').toLowerCase())>=0;}).length;
      var cpFaulted=cp.filter(function(c){return (c.connectivity_status||c.status||'').toLowerCase()==='faulted';}).length;
      var totalEnergy=sess.reduce(function(a,s){return a+parseFloat(s.energy||0);},0)/1000;
      var totalRev=txns.reduce(function(a,t){return a+parseFloat(t.totalAmount||t.amount||0);},0);
      var avgKwh=sess.length?(totalEnergy/sess.length).toFixed(2):'0.00';

      var cards=document.createElement('div'); cards.className='cards';
      [
        {icon:'🔌',label:'Charge Points',   value:cp.length,               color:'#00c2a8',sub:cpOnline+' online · '+cpFaulted+' faulted'},
        {icon:'📍',label:'Locations',        value:locs.length,             color:'#3b82f6'},
        {icon:'⚡',label:'Active Now',       value:active.length,           color:'#a78bfa'},
        {icon:'📋',label:'Sessions',         value:sess.length,             color:'#06b6d4',sub:mLabel},
        {icon:'🔋',label:'Energy (kWh)',     value:totalEnergy.toFixed(1),  color:'#f59e0b',sub:'avg '+avgKwh+' kWh · '+mLabel},
        {icon:'💰',label:'Revenue',          value:'$'+totalRev.toFixed(2), color:'#10b981',sub:mLabel},
      ].forEach(function(c){
        var d=document.createElement('div'); d.className='card';
        d.innerHTML='<div class="ci">'+c.icon+'</div><div class="cl">'+c.label+'</div>'
          +'<div class="cv" style="color:'+c.color+'">'+c.value+'</div>'
          +(c.sub?'<div class="cs">'+c.sub+'</div>':'');
        cards.appendChild(d);
      }); el.appendChild(cards);

      // Active sessions
      if(active.length){
        var sec=mkSec('⚡ Currently Charging ('+active.length+')');
        var rows=active.map(function(s){
          return mkTRow([mkTd(s.id,'mono'),mkTd(cpName(cp,s.chargePointId),'muted'),mkTd(fmt(s.startedAt),'muted'),mkTd((parseFloat(s.energy||0)/1000).toFixed(2))]);
        });
        sec.appendChild(mkTable(['Session','Charger','Started','kWh'],rows)); el.appendChild(sec);
      }

      // CP status grid
      var statusCounts=cp.reduce(function(a,c){var s=c.connectivity_status||c.status||'unknown';a[s]=(a[s]||0)+1;return a;},{});
      var sec=mkSec('Charger Status');
      var sg=document.createElement('div'); sg.className='sgrid';
      Object.keys(statusCounts).forEach(function(s){
        var box=document.createElement('div'); box.className='sbox';
        box.appendChild(mkBadge(s));
        var num=document.createElement('div'); num.className='snum'; num.textContent=statusCounts[s];
        box.appendChild(num); sg.appendChild(box);
      });
      sec.appendChild(sg); el.appendChild(sec);

      // Top chargers bar chart
      if(sess.length){
        var cpSess=sess.reduce(function(a,s){var id=String(s.chargePointId||s.charge_point_id||'');if(id){a[id]=(a[id]||0)+1;}return a;},{});
        var top=Object.keys(cpSess).map(function(k){return[k,cpSess[k]];}).sort(function(a,b){return b[1]-a[1];});
        var maxV=top[0]?top[0][1]:1;
        var pw=document.createElement('div'); pw.className='pw';
        var t=document.createElement('div'); t.className='stitle'; t.textContent='Sessions by Charger — '+mLabel; pw.appendChild(t);
        top.forEach(function(e){
          var label=cpName(cp,e[0]);
          var item=document.createElement('div'); item.className='pi';
          var row=document.createElement('div'); row.className='pr';
          var l=document.createElement('span'); l.textContent=label;
          var v=document.createElement('span'); v.style.color='#8892a4'; v.textContent=e[1]+' sessions';
          row.appendChild(l); row.appendChild(v);
          var track=document.createElement('div'); track.className='pt';
          var fill=document.createElement('div'); fill.className='pf'; fill.style.width=Math.round(e[1]/maxV*100)+'%';
          track.appendChild(fill); item.appendChild(row); item.appendChild(track); pw.appendChild(item);
        });
        el.appendChild(pw);
      }

      // Locations
      if(locs.length){
        var sec=mkSec('Locations');
        var grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px';
        locs.forEach(function(l){
          var c=document.createElement('div'); c.style.cssText='background:#0d1117;border-radius:10px;padding:14px';
          c.innerHTML='<div style="font-weight:700;font-size:14px;margin-bottom:6px">📍 '+n(l.name)+'</div>'
            +'<div style="color:#8892a4;font-size:12px">'+([n(l.address),l.city,l.region,l.country].filter(Boolean).join(', ')||'–')+'</div>';
          grid.appendChild(c);
        });
        sec.appendChild(grid); el.appendChild(sec);
      }
      return;
    }

    if(currentTab==='chargers'){
      var rows=cp.map(function(c){
        return mkTRow([mkTd(c.id,'mono'),mkTd(n(c.name)),mkTd(c.serial_number||'–','mono muted'),mkBdgTd(c.connectivity_status||c.status),mkTd(c.model||c.vendor||'–','muted')]);
      });
      el.appendChild(mkTable(['ID','Name','Serial','Status','Model'],rows));
      return;
    }

    if(currentTab==='sessions'){
      var combined=active.concat(sess), seen={};
      var deduped=combined.filter(function(s){if(seen[s.id])return false;seen[s.id]=true;return true;});
      var note=document.createElement('div'); note.style.cssText='color:#8892a4;font-size:12px;margin-bottom:10px';
      note.textContent=deduped.length+' sessions · '+mLabel; el.appendChild(note);
      var rows=deduped.slice(0,500).map(function(s){
        var dur=s.stoppedAt&&s.startedAt?Math.round((new Date(s.stoppedAt)-new Date(s.startedAt))/60000)+'m':'–';
        return mkTRow([mkTd(s.id,'mono'),mkBdgTd(s.status),mkTd(fmt(s.startedAt),'muted'),mkTd((parseFloat(s.energy||0)/1000).toFixed(2)),mkTd(dur,'muted'),mkTd(cpName(cp,s.chargePointId),'muted'),mkTd(money(s.amount),'green')]);
      });
      el.appendChild(mkTable(['ID','Status','Started','kWh','Duration','Charger','Amount'],rows));
      return;
    }

    if(currentTab==='transactions'){
      var note=document.createElement('div'); note.style.cssText='color:#8892a4;font-size:12px;margin-bottom:10px';
      note.textContent=txns.length+' transactions · '+mLabel; el.appendChild(note);
      var rows=txns.slice(0,500).map(function(t){
        return mkTRow([mkTd(t.id,'mono'),mkTd(t.sessionId||t.session_id||'–','mono muted'),mkTd(money(t.totalAmount||t.amount),'green'),mkTd(t.currency||'USD','muted'),mkBdgTd(t.status),mkTd(fmt(t.date||t.created_at),'muted')]);
      });
      el.appendChild(mkTable(['ID','Session','Amount','Currency','Status','Date'],rows));
      return;
    }

    if(currentTab==='locations'){
      if(!locs.length){var d=document.createElement('div');d.className='empty';d.textContent='No locations';el.appendChild(d);return;}
      var grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px';
      locs.forEach(function(l){
        var c=document.createElement('div'); c.style.cssText='background:#1a1f2e;border-radius:12px;padding:16px';
        c.innerHTML='<div style="font-weight:700;font-size:15px;margin-bottom:6px">📍 '+n(l.name)+'</div>'
          +'<div style="color:#8892a4;font-size:12px;margin-bottom:4px">'+([n(l.address),l.city,l.region,l.country].filter(Boolean).join(', ')||'–')+'</div>'
          +'<div style="color:#4b5563;font-size:11px">'+(l.external_id||'ID: '+l.id)+'</div>'
          +(l.public_charge_points!=null?'<div style="color:#00c2a8;font-size:12px;margin-top:6px">🔌 '+l.public_charge_points+' public CPs</div>':'');
        grid.appendChild(c);
      });
      el.appendChild(grid);
    }
  } catch(e){
    var d=document.createElement('div'); d.className='err';
    d.textContent='⚠️ Render error: '+e.message; el.appendChild(d);
  }
}

// ── Helpers ────────────────────────────────────────────────────
function cpName(cpList, id){
  var c=cpList.filter(function(x){return String(x.id)===String(id);})[0];
  return c ? (n(c.name)||c.serial_number||'CP '+id) : 'CP '+id;
}
function mkSec(title){
  var sec=document.createElement('div'); sec.className='sec';
  var t=document.createElement('div'); t.className='stitle'; t.textContent=title;
  sec.appendChild(t); return sec;
}
function mkTable(headers,rows){
  var wrap=document.createElement('div'); wrap.className='tw';
  var tbl=document.createElement('table');
  var thead=document.createElement('thead'),hr=document.createElement('tr');
  headers.forEach(function(h){var th=document.createElement('th');th.textContent=h;hr.appendChild(th);});
  thead.appendChild(hr); tbl.appendChild(thead);
  var tbody=document.createElement('tbody');
  if(!rows||!rows.length){var tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=headers.length;td.className='empty';td.textContent='No data';tr.appendChild(td);tbody.appendChild(tr);}
  else{rows.forEach(function(r){tbody.appendChild(r);});}
  tbl.appendChild(tbody); wrap.appendChild(tbl); return wrap;
}
function mkTRow(cells){var tr=document.createElement('tr');cells.forEach(function(c){tr.appendChild(c);});return tr;}
function mkTd(text,cls){var td=document.createElement('td');td.textContent=text||'–';if(cls)td.className=cls;return td;}
function mkBdgTd(s){var td=document.createElement('td');td.appendChild(mkBadge(s));return td;}

// ── Start ──────────────────────────────────────────────────────
init();
</script>
